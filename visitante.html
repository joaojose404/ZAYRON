<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Navegação Visitante - Secure Tech</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

    <style>
        :root {
            --navy: #020617;
            --lead: rgba(30, 41, 59, 0.95);
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.12);
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: "Segoe UI", sans-serif;
            background: var(--navy);
            overflow: hidden;
            color: var(--text);
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100% !important;
            height: 100% !important;
            z-index: 1;
            transform: none !important;
        }

        .overlay {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 20;
            width: min(420px, calc(100vw - 28px));
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel {
            background: var(--lead);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 12px 32px rgba(0,0,0,.3);
            backdrop-filter: blur(6px);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 700;
            color: #dbeafe;
        }

        .mini-btn {
            width: auto;
            padding: 8px 10px;
            font-size: 11px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.08);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .container-login {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            background: var(--navy);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 15px;
            width: 88%;
            max-width: 360px;
            text-align: center;
            color: white;
            box-shadow: 0 12px 32px rgba(0,0,0,.35);
        }

        .title {
            font-size: 22px;
            color: var(--accent);
            margin: 0 0 6px 0;
        }

        .subtitle {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 18px;
        }

        .tab-buttons {
            display: flex;
            gap: 6px;
        }

        .tab-btn {
            background: rgba(255,255,255,0.08);
            font-size: 11px;
            padding: 10px;
            flex: 1;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .tab-btn.active {
            background: var(--accent);
        }

        input, select, button {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            background: var(--lead);
            color: white;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(59,130,246,.18);
        }

        button {
            cursor: pointer;
            font-weight: bold;
        }

        button.primary { background: var(--accent); border: none; }
        button.success { background: var(--success); border: none; }
        button.warning { background: var(--warning); color: #111827; border: none; }

        .hidden { display: none !important; }

        .info-box {
            font-size: 12px;
            line-height: 1.5;
            color: #e2e8f0;
        }

        .status-line {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            min-height: 18px;
        }

        .alert-box {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            display: none;
        }

        .alert-box.show { display: block; }
        .alert-success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.45); color: #d1fae5; }
        .alert-warning { background: rgba(245,158,11,0.15); border: 1px solid rgba(245,158,11,0.45); color: #fde68a; }
        .alert-danger  { background: rgba(239,68,68,0.15);  border: 1px solid rgba(239,68,68,0.45);  color: #fecaca; }

        .leaflet-routing-container { display: none; }

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip { background: #0f172a; color: white; }

        @media (max-width: 700px) {
            .overlay {
                top: auto;
                left: 10px;
                right: 10px;
                bottom: 10px;
                width: auto;
                max-width: none;
            }
            .panel { padding: 12px; max-height: 40vh; overflow-y: auto; }
            .panel.reduced { max-height: 72px; overflow: hidden; }
            .panel.reduced .panel-body { display: none; }
            .tab-btn { padding: 12px 8px; font-size: 10px; }
            .container-login { width: calc(100vw - 24px); max-width: none; }
        }
    </style>
</head>
<body>

    <div id="step-condo" class="container-login">
        <h2 class="title">Acesso</h2>
        <div class="subtitle">Digite o nome do condomínio</div>
        <input type="text" id="input-condo" placeholder="CONDOMÍNIO"
            oninput="limparStatusCondominio()"
            onkeydown="if(event.key==='Enter'){conectarCondominio()}" />
        <button class="primary" style="margin-top:10px;" onclick="conectarCondominio()">Continuar</button>
        <div id="status-condo" class="status-line" style="margin-top:12px;"></div>
    </div>

    <div id="step-ident" class="container-login hidden">
        <h2 class="title">Identificação</h2>
        <div class="subtitle">Preencha seus dados para iniciar a navegação</div>
        <input type="text" id="input-nome" placeholder="SEU NOME" />
        <input type="text" id="input-placa" placeholder="PLACA (OBRIGATÓRIA)" />
        <input type="text" id="input-liberado-por" placeholder="LIBERADO POR" />
        <button class="primary" style="margin-top:10px;" onclick="irParaMapa()">Iniciar</button>
    </div>

    <div id="step-mapa" class="overlay hidden">
        <div class="panel" id="painel-mapa">
            <div class="panel-header">
                <div class="panel-title">Navegação do Visitante</div>
                <button class="mini-btn" onclick="togglePainelMapa()" id="btn-toggle-painel">Ocultar</button>
            </div>
            <div class="panel-body">
                <div class="tab-buttons">
                    <button class="tab-btn active" id="btn-rua" onclick="switchTab('rua')">RUA / Nº</button>
                    <button class="tab-btn" id="btn-quadra" onclick="switchTab('quadra')">QUADRA / LOTE</button>
                </div>
                <div id="busca-rua" style="margin-top:10px;">
                    <select id="select-rua" onchange="limparBusca()">
                        <option value="">SELECIONE A RUA</option>
                    </select>
                    <input type="text" id="input-num" placeholder="NÚMERO" oninput="buscarDestino('rua')" />
                </div>
                <div id="busca-quadra" class="hidden" style="margin-top:10px;">
                    <select id="select-quadra" onchange="limparBusca()">
                        <option value="">SELECIONE A QUADRA</option>
                    </select>
                    <input type="text" id="input-lote" placeholder="LOTE" oninput="buscarDestino('quadra')" />
                </div>
                <div class="info-box" id="info-destino" style="margin-top:12px;">
                    Selecione o destino para traçar a rota.
                </div>
                <div class="status-line" id="status-rota" style="margin-top:10px;"></div>
                <div id="alerta-box" class="alert-box"></div>
                <div style="margin-top:10px; display:flex; gap:8px;">
                    <button class="success" onclick="centralizarNaMinhaPosicao()">Minha posição</button>
                    <button class="warning" onclick="retornarPortaria()">Retornar à Portaria</button>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        const API = "https://zayron-api-1011701557501.southamerica-east1.run.app";

        function normalizarTexto(valor) {
            return String(valor || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim()
                .toUpperCase();
        }

        async function apiGet(url) {
            const res = await fetch(API + url, { method: 'GET', headers: { 'Accept': 'application/json' } });
            const json = await res.json().catch(() => ({}));
            if (!res.ok || json.success === false) throw new Error(json.message || json.details || `Erro HTTP ${res.status}`);
            return json.data ?? json;
        }

        async function apiPost(url, body) {
            const res = await fetch(API + url, {
                method: "POST",
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(body)
            });
            const json = await res.json().catch(() => ({}));
            if (!res.ok || json.success === false) throw new Error(json.message || json.details || `Erro HTTP ${res.status}`);
            return json.data ?? json;
        }

        async function apiPatch(url, body) {
            const res = await fetch(API + url, {
                method: "PATCH",
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(body)
            });
            const json = await res.json().catch(() => ({}));
            if (!res.ok || json.success === false) throw new Error(json.message || json.details || `Erro HTTP ${res.status}`);
            return json.data ?? json;
        }

        let map = null;
        let routingControl = null;
        let portariaMarker = null;
        let destinoMarker = null;
        let visitanteMarker = null;
        let visitanteMarkerRealGpsZayron = null;

        let condominioAtual = null;
        let lotesCondominio = [];
        let visitaAtualId = null;
        let loteDestinoAtual = null;
        let geolocationWatchId = null;
        let ultimoEnvioPosicao = 0;
        let minhaPosicaoAtual = null;
        let horarioEntradaSistemaLocal = null;

        let rotaModo = 'destino';
        let destinoAtualCoords = null;
        let destinoChegou = false;
        let ultimoDesvioEm = 0;
        let ultimoExcessoVelocidadeEm = 0;
        let ultimoParadoEm = 0;
        let paradaIniciadaEm = null;
        let ultimoTempoMonitoramento = null;
        let ultimaPosicaoMonitoramento = null;
        let ultimaVelocidadeCalculadaKmh = 0;
        let ultimaAtualizacaoRotaEm = 0;
        let ultimaPosicaoValida = null;
        let modoNavegacaoAtivo = false;
        let retornoAutomaticoIniciado = false;
        let visitaEncerradaAutomaticamente = false;
        let avisoChegadaDestinoMostrado = false;

        const LIMITE_VELOCIDADE_KMH = 30;
        const TEMPO_PARADO_ALERTA_MS = 30000;
        const DISTANCIA_PARADO_METROS = 3;
        const DISTANCIA_CHEGADA_METROS = 35;
        const DISTANCIA_DESVIO_METROS = 35;
        const ZOOM_NAVEGACAO = 20;
        const ZOOM_NAVEGACAO_MOBILE = 20;
        const MAPA_PAINEL_OFFSET_DESKTOP = 210;
        const MAPA_PAINEL_OFFSET_VERTICAL = 130;
        const GOOGLE_SATELLITE_TILE = 'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}';

        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function isMobile() { return window.innerWidth <= 700; }

        function togglePainelMapa(force = null) {
            const painel = document.getElementById('painel-mapa');
            const botao = document.getElementById('btn-toggle-painel');
            const reduzir = force === null ? !painel.classList.contains('reduced') : force;
            painel.classList.toggle('reduced', reduzir);
            botao.innerText = reduzir ? 'Mostrar' : 'Ocultar';
        }

        function limparStatusCondominio() {
            document.getElementById('status-condo').innerText = '';
        }

        function mostrarAlerta(tipo, mensagem) {
            const box = document.getElementById('alerta-box');
            box.className = 'alert-box show';
            if (tipo === 'success') box.classList.add('alert-success');
            else if (tipo === 'warning') box.classList.add('alert-warning');
            else box.classList.add('alert-danger');
            box.innerText = mensagem;
        }

        function limparAlerta() {
            const box = document.getElementById('alerta-box');
            box.className = 'alert-box';
            box.innerText = '';
        }

        async function conectarCondominio() {
            const nomeDigitado = document.getElementById('input-condo').value.trim();
            const nomeBusca = normalizarTexto(nomeDigitado);
            const status = document.getElementById('status-condo');

            if (!nomeBusca || nomeBusca.length < 2) {
                status.innerText = 'Digite o nome do condomínio.';
                return;
            }

            status.innerText = 'Buscando condomínio...';

            try {
                const condos = await apiGet(`/public/condominios?busca=${encodeURIComponent(nomeDigitado)}`);
                const lista = Array.isArray(condos) ? condos : [];

                if (!lista.length) { status.innerText = 'Condomínio não encontrado.'; return; }

                condominioAtual =
                    lista.find(c => normalizarTexto(c.nome) === nomeBusca) ||
                    lista.find(c => normalizarTexto(c.nome).includes(nomeBusca)) ||
                    lista.find(c => nomeBusca.includes(normalizarTexto(c.nome))) ||
                    lista[0];

                if (!condominioAtual?.id) { status.innerText = 'Condomínio não encontrado.'; return; }

                status.innerText = `Condomínio encontrado: ${condominioAtual.nome}. Carregando unidades...`;

                const lotes = await apiGet(`/public/lotes?condominio_id=${encodeURIComponent(condominioAtual.id)}`);
                lotesCondominio = Array.isArray(lotes) ? lotes : [];

                if (!lotesCondominio.length) {
                    status.innerText = 'Este condomínio não possui unidades cadastradas.';
                    return;
                }

                status.innerText = `Condomínio encontrado: ${condominioAtual.nome}`;
                setTimeout(() => {
                    document.getElementById('step-condo').classList.add('hidden');
                    document.getElementById('step-ident').classList.remove('hidden');
                }, 300);
            } catch (err) {
                console.error('Erro ao conectar condomínio:', err);
                status.innerText = `Falha de conexão: ${err.message}`;
            }
        }

        async function irParaMapa() {
            const nome = document.getElementById('input-nome').value.trim();
            const placa = document.getElementById('input-placa').value.trim().toUpperCase();
            const liberadoPor = document.getElementById('input-liberado-por').value.trim().toUpperCase();

            if (!nome) { alert('Informe seu nome.'); return; }
            if (!placa) { alert('Informe a placa do veículo.'); return; }
            if (!liberadoPor) { alert('Informe quem liberou a entrada.'); return; }

            horarioEntradaSistemaLocal = new Date().toISOString();

            document.getElementById('step-ident').classList.add('hidden');
            document.getElementById('step-mapa').classList.remove('hidden');

            popularFiltros();
            iniciarMapa();

            if (isMobile()) togglePainelMapa(false);

            if (!navigator.geolocation) { alert('Seu dispositivo não suporta localização.'); return; }

            document.getElementById('status-rota').innerText = 'Solicitando sua localização...';

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    minhaPosicaoAtual = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    atualizarMarcadorVisitante(minhaPosicaoAtual.lat, minhaPosicaoAtual.lng, true);
                    document.getElementById('status-rota').innerText = 'Localização obtida. Escolha o destino.';
                    iniciarRastreamentoVisitante(true);
                },
                (error) => {
                    console.error('Erro ao obter localização inicial:', error);
                    alert('Ative a localização do celular para iniciar a navegação.');
                    document.getElementById('status-rota').innerText = 'Localização não autorizada. Ative o GPS do celular.';
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
            );
        }

        function getPortariaCoords() {
            if (condominioAtual?.portaria_latitude != null && condominioAtual?.portaria_longitude != null) {
                return [Number(condominioAtual.portaria_latitude), Number(condominioAtual.portaria_longitude)];
            }
            return [-23.2066, -47.0348];
        }

        function iniciarMapa() {
            const portaria = getPortariaCoords();

            if (!map) {
                map = L.map('map', {
                    zoomControl: true,
                    maxZoom: 22,
                    zoomSnap: 0.25,
                    zoomDelta: 0.5
                }).setView(portaria, ZOOM_NAVEGACAO);

                L.tileLayer(GOOGLE_SATELLITE_TILE, {
                    maxZoom: 22,
                    maxNativeZoom: 22,
                    attribution: 'Imagens © Google'
                }).addTo(map);

                portariaMarker = L.marker(portaria).addTo(map).bindPopup('<b>Portaria</b>');
            } else {
                map.flyTo(portaria, ZOOM_NAVEGACAO, { duration: 0.5 });
            }

            // Corrige tamanho do mapa múltiplas vezes (especialmente iOS)
            [100, 300, 600, 1000, 2000].forEach(ms => setTimeout(() => { if (map) map.invalidateSize(true); }, ms));
        }

        function popularFiltros() {
            const selRua = document.getElementById('select-rua');
            const selQuadra = document.getElementById('select-quadra');

            selRua.innerHTML = '<option value="">SELECIONE A RUA</option>';
            selQuadra.innerHTML = '<option value="">SELECIONE A QUADRA</option>';

            const ruas = [...new Set(lotesCondominio.map(c => c.rua).filter(Boolean))].sort();
            const quadras = [...new Set(lotesCondominio.map(c => c.quadra).filter(Boolean))].sort();

            ruas.forEach(r => { selRua.innerHTML += `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`; });
            quadras.forEach(q => { selQuadra.innerHTML += `<option value="${escapeHtml(q)}">${escapeHtml(q)}</option>`; });
        }

        function switchTab(tab) {
            document.getElementById('busca-rua').classList.toggle('hidden', tab !== 'rua');
            document.getElementById('busca-quadra').classList.toggle('hidden', tab !== 'quadra');
            document.getElementById('btn-rua').classList.toggle('active', tab === 'rua');
            document.getElementById('btn-quadra').classList.toggle('active', tab === 'quadra');
            limparBusca();
        }

        function buscarDestino(tipo) {
            let lote = null;

            if (tipo === 'rua') {
                const rua = document.getElementById('select-rua').value;
                const numero = document.getElementById('input-num').value.trim();
                if (!rua || !numero) return;
                lote = lotesCondominio.find(c => c.rua === rua && String(c.numero || '') === String(numero));
            } else {
                const quadra = document.getElementById('select-quadra').value;
                const loteNum = document.getElementById('input-lote').value.trim();
                if (!quadra || !loteNum) return;
                lote = lotesCondominio.find(c => c.quadra === quadra && String(c.lote || '') === String(loteNum));
            }

            if (!lote) return;

            if (lote.latitude == null || lote.longitude == null) {
                alert('Esta unidade não possui coordenadas cadastradas.');
                return;
            }

            rotaModo = 'destino';
            destinoChegou = false;
            loteDestinoAtual = lote;
            destinoAtualCoords = [Number(lote.latitude), Number(lote.longitude)];
            limparAlerta();

            document.getElementById('info-destino').innerHTML = `
                <b>Destino encontrado</b><br>
                Rua: ${escapeHtml(lote.rua || '-')} ${escapeHtml(lote.numero || '')}<br>
                Quadra: ${escapeHtml(lote.quadra || '-')} | Lote: ${escapeHtml(lote.lote || '-')}
            `;

            tracarRotaAteDestino(destinoAtualCoords[0], destinoAtualCoords[1]);

            // Abre mapa externo (Apple Maps no iOS, Google Maps no Android) em nova aba
            // O monitoramento continua rodando nesta aba em segundo plano
            const origemNav = minhaPosicaoAtual || { lat: getPortariaCoords()[0], lng: getPortariaCoords()[1] };
            abrirNavegacaoExterna(origemNav, { lat: Number(lote.latitude), lng: Number(lote.longitude) });

            registrarOuAtualizarVisita();

            if (isMobile()) togglePainelMapa(true);
        }

        // Abre Apple Maps (iOS) ou Google Maps (Android)
        // O monitoramento Zayron continua ativo nesta aba em segundo plano
        function abrirNavegacaoExterna(origem, destino) {
            const o = origem.lat + ',' + origem.lng;
            const d = destino.lat + ',' + destino.lng;

            if (isIOS()) {
                // iOS: Safari bloqueia redirecionamentos automáticos.
                // Mostra botão flutuante para o usuário tocar e abrir Apple Maps.
                const velho = document.getElementById('zayron-abrir-maps-ios');
                if (velho) velho.remove();

                const url = 'maps://?saddr=' + encodeURIComponent(o) + '&daddr=' + encodeURIComponent(d) + '&dirflg=d';

                const btn = document.createElement('a');
                btn.id = 'zayron-abrir-maps-ios';
                btn.href = url;
                btn.innerText = '🗺️ Abrir Apple Maps';
                btn.style.cssText = [
                    'position:fixed',
                    'left:14px',
                    'right:14px',
                    'bottom:calc(20px + env(safe-area-inset-bottom))',
                    'z-index:99999',
                    'display:block',
                    'height:58px',
                    'line-height:58px',
                    'text-align:center',
                    'border-radius:16px',
                    'background:#f59e0b',
                    'color:#111827',
                    'font-weight:900',
                    'font-size:18px',
                    'text-decoration:none',
                    'box-shadow:0 8px 24px rgba(0,0,0,.4)'
                ].join(';');

                // Some automaticamente após 15 segundos
                btn.onclick = () => setTimeout(() => btn.remove(), 1500);
                setTimeout(() => { if (btn.parentNode) btn.remove(); }, 15000);

                document.body.appendChild(btn);
            } else {
                // Android: abre Google Maps direto via intent geo
                window.location.href = 'geo:' + d + '?q=' + encodeURIComponent(d);
            }
        }

        function obterOrigemRota() {
            if (minhaPosicaoAtual && minhaPosicaoAtual.lat && minhaPosicaoAtual.lng) {
                return [minhaPosicaoAtual.lat, minhaPosicaoAtual.lng];
            }
            return getPortariaCoords();
        }

        function getPaddingMapa() {
            if (isMobile()) return { paddingTopLeft: [20, 20], paddingBottomRight: [20, 220] };
            return { paddingTopLeft: [450, 30], paddingBottomRight: [30, 30] };
        }

        function centralizarMapaNoVisitante(lat, lng, animate = true) {
            if (!map || lat == null || lng == null) return;
            const zoom = isMobile() ? ZOOM_NAVEGACAO_MOBILE : ZOOM_NAVEGACAO;
            map.setView([Number(lat), Number(lng)], zoom, { animate });
            setTimeout(() => {
                if (!map) return;
                if (isMobile()) map.panBy([0, MAPA_PAINEL_OFFSET_VERTICAL], { animate: false });
                else map.panBy([-MAPA_PAINEL_OFFSET_DESKTOP, MAPA_PAINEL_OFFSET_VERTICAL], { animate: false });
            }, 80);
        }

        function decodePolyline(encoded) {
            let points = [], index = 0, lat = 0, lng = 0;
            while (index < encoded.length) {
                let b, shift = 0, result = 0;
                do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
                lat += (result & 1) ? ~(result >> 1) : (result >> 1);
                shift = 0; result = 0;
                do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
                lng += (result & 1) ? ~(result >> 1) : (result >> 1);
                points.push([lat / 1e5, lng / 1e5]);
            }
            return points;
        }

        async function calcularRotaGoogle(origem, destino) {
            return await apiPost('/google/rota', {
                origem: { lat: Number(origem.lat), lng: Number(origem.lng) },
                destino: { lat: Number(destino.lat), lng: Number(destino.lng) }
            });
        }

        async function calcularRotaOSRM(origem, destino) {
            const url = 'https://router.project-osrm.org/route/v1/driving/' +
                origem.lng + ',' + origem.lat + ';' + destino.lng + ',' + destino.lat +
                '?overview=full&geometries=geojson&steps=false';
            const res = await fetch(url);
            const data = await res.json();
            const coords = data?.routes?.[0]?.geometry?.coordinates;
            if (!Array.isArray(coords) || coords.length < 2) throw new Error('OSRM sem rota.');
            return coords.map(c => [c[1], c[0]]);
        }

        function zayronCoordValida(lat, lng) {
            lat = Number(lat); lng = Number(lng);
            return Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180;
        }

        function zayronLimparRotaAtual() {
            if (routingControl) { try { map.removeControl(routingControl); } catch(e) {} routingControl = null; }
            if (window.rotaPolyline) { try { map.removeLayer(window.rotaPolyline); } catch(e) {} window.rotaPolyline = null; }
            if (window.rotaPolylineBorda) { try { map.removeLayer(window.rotaPolylineBorda); } catch(e) {} window.rotaPolylineBorda = null; }
            if (destinoMarker) { try { map.removeLayer(destinoMarker); } catch(e) {} destinoMarker = null; }
        }

        function zayronDesenharRota(coords, destinoLat, destinoLng, mensagem) {
            if (!map || !Array.isArray(coords) || coords.length < 2) return;
            zayronLimparRotaAtual();
            destinoMarker = L.marker([destinoLat, destinoLng]).addTo(map)
                .bindPopup(rotaModo === 'retorno' ? '<b>Portaria / Saída</b>' : '<b>Destino</b>');
            window.rotaPolylineBorda = L.polyline(coords, {
                color: '#ffffff', weight: 13, opacity: 0.95, lineJoin: 'round', lineCap: 'round', smoothFactor: 2
            }).addTo(map);
            window.rotaPolyline = L.polyline(coords, {
                color: '#2563eb', weight: 8, opacity: 1, lineJoin: 'round', lineCap: 'round', smoothFactor: 2
            }).addTo(map);
            window.rotaAtualCoords = coords;
            ultimaAtualizacaoRotaEm = Date.now();
            const statusEl = document.getElementById('status-rota');
            if (statusEl) statusEl.innerText = mensagem || 'Rota calculada.';
            try { map.fitBounds(coords, getPaddingMapa()); } catch(e) {
                const o = obterOrigemRota();
                centralizarMapaNoVisitante(o[0], o[1], false);
            }
        }

        async function tracarRotaAteDestino(destLat, destLng) {
            if (!map) return;
            const origemArray = obterOrigemRota();
            modoNavegacaoAtivo = true;
            const origem = { lat: Number(origemArray[0]), lng: Number(origemArray[1]) };
            const destino = { lat: Number(destLat), lng: Number(destLng) };

            if (!zayronCoordValida(origem.lat, origem.lng) || !zayronCoordValida(destino.lat, destino.lng)) {
                document.getElementById('status-rota').innerText = 'Coordenadas inválidas para calcular rota.';
                return;
            }

            document.getElementById('status-rota').innerText = 'Calculando rota...';
            let coords = null;

            try {
                const rotaGoogle = await calcularRotaGoogle(origem, destino);
                const encoded = rotaGoogle?.polyline?.encodedPolyline;
                if (encoded) coords = decodePolyline(encoded);
            } catch (e) { console.warn('Google/backend falhou, usando OSRM:', e); }

            if (!coords || coords.length < 2) {
                try { coords = await calcularRotaOSRM(origem, destino); }
                catch (e) { console.warn('OSRM falhou, linha simples:', e); coords = [[origem.lat, origem.lng], [destino.lat, destino.lng]]; }
            }

            zayronDesenharRota(coords, destino.lat, destino.lng,
                rotaModo === 'retorno' ? 'Rota de saída calculada.' : 'Rota de entrada calculada.');

            if (minhaPosicaoAtual) atualizarMarcadorVisitante(minhaPosicaoAtual.lat, minhaPosicaoAtual.lng, false);
        }

        function zayronProjetarNaRota(p, a, b) {
            const dx = b.lng - a.lng, dy = b.lat - a.lat;
            if (dx === 0 && dy === 0) return { lat: a.lat, lng: a.lng };
            let t = ((p.lng - a.lng) * dx + (p.lat - a.lat) * dy) / (dx * dx + dy * dy);
            t = Math.max(0, Math.min(1, t));
            return { lat: a.lat + t * dy, lng: a.lng + t * dx };
        }

        function zayronDistanciaMetrosPontos(a, b) {
            const R = 6371000, rad = v => v * Math.PI / 180;
            const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
            const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
            return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
        }

        function zayronNormalizarRota(coords) {
            return (coords || []).map(c => Array.isArray(c)
                ? { lat: Number(c[0]), lng: Number(c[1]) }
                : { lat: Number(c.lat ?? c.latitude), lng: Number(c.lng ?? c.longitude) }
            ).filter(p => zayronCoordValida(p.lat, p.lng));
        }

        function zayronSnapNaRota(lat, lng) {
            const rota = zayronNormalizarRota(window.rotaAtualCoords || []);
            const real = { lat: Number(lat), lng: Number(lng) };
            if (!zayronCoordValida(real.lat, real.lng) || rota.length < 2) return { ponto: real, distancia: 0 };
            let melhor = { ponto: real, distancia: Infinity };
            for (let i = 0; i < rota.length - 1; i++) {
                const projetado = zayronProjetarNaRota(real, rota[i], rota[i + 1]);
                const dist = zayronDistanciaMetrosPontos(real, projetado);
                if (dist < melhor.distancia) melhor = { ponto: projetado, distancia: dist };
            }
            return melhor;
        }

        function zayronPosicaoExibida(lat, lng) {
            const snap = zayronSnapNaRota(lat, lng);
            if ((window.rotaAtualCoords || []).length >= 2 && snap.ponto && zayronCoordValida(snap.ponto.lat, snap.ponto.lng)) {
                return snap.ponto;
            }
            return { lat: Number(lat), lng: Number(lng) };
        }

        function zayronAnimarMarcador(marker, destino) {
            if (!marker || !destino) return;
            const atual = marker.getLatLng();
            const inicio = { lat: atual.lat, lng: atual.lng };
            const fim = { lat: Number(destino.lat), lng: Number(destino.lng) };
            if (!zayronCoordValida(fim.lat, fim.lng)) return;
            const frames = 14;
            let frame = 0;
            if (marker._zayronAnimTimer) clearInterval(marker._zayronAnimTimer);
            marker._zayronAnimTimer = setInterval(() => {
                frame++;
                const t = Math.min(1, frame / frames);
                const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
                marker.setLatLng([inicio.lat + (fim.lat - inicio.lat) * ease, inicio.lng + (fim.lng - inicio.lng) * ease]);
                if (frame >= frames) { clearInterval(marker._zayronAnimTimer); marker._zayronAnimTimer = null; }
            }, 24);
        }

        function atualizarMarcadorVisitante(lat, lng, centralizar = false) {
            if (!map || !zayronCoordValida(lat, lng)) return;
            const real = { lat: Number(lat), lng: Number(lng) };
            const exibida = zayronPosicaoExibida(real.lat, real.lng);

            if (visitanteMarker) {
                zayronAnimarMarcador(visitanteMarker, exibida);
            } else {
                visitanteMarker = L.circleMarker([exibida.lat, exibida.lng], {
                    radius: 10, color: '#ffffff', fillColor: '#10b981', fillOpacity: 1, weight: 4
                }).addTo(map).bindPopup('<b>Você está aqui</b>');
            }

            if (!visitanteMarkerRealGpsZayron) {
                visitanteMarkerRealGpsZayron = L.circleMarker([real.lat, real.lng], {
                    radius: 4, color: '#fbbf24', fillColor: '#fbbf24', fillOpacity: 0.55, weight: 1, opacity: 0.65
                }).addTo(map);
            } else {
                visitanteMarkerRealGpsZayron.setLatLng([real.lat, real.lng]);
            }

            if (centralizar && map) centralizarMapaNoVisitante(real.lat, real.lng, true);
        }

        async function registrarOuAtualizarVisita() {
            if (!condominioAtual || !loteDestinoAtual) return;
            const nome = document.getElementById('input-nome').value.trim().toUpperCase();
            const placa = document.getElementById('input-placa').value.trim().toUpperCase();
            const liberadoPor = document.getElementById('input-liberado-por').value.trim().toUpperCase();
            try {
                if (!visitaAtualId) {
                    const data = await apiPost('/public/visitas', {
                        condominio_id: condominioAtual.id,
                        lote_id: loteDestinoAtual.id,
                        nome_visitante: nome,
                        placa: placa,
                        autorizado_por: liberadoPor,
                        destino_texto: montarDestinoTexto(loteDestinoAtual),
                        status: 'em_rota',
                        horario_entrada_sistema: horarioEntradaSistemaLocal || new Date().toISOString(),
                        observacoes: 'Visita iniciada pelo sistema de navegação.'
                    });
                    visitaAtualId = data.id;
                } else {
                    await apiPatch(`/public/visitas/${visitaAtualId}`, {
                        lote_id: loteDestinoAtual.id,
                        placa: placa,
                        autorizado_por: liberadoPor,
                        destino_texto: montarDestinoTexto(loteDestinoAtual),
                        status: 'em_rota'
                    });
                }
            } catch (err) { console.error('registrarOuAtualizarVisita:', err); }
        }

        function montarDestinoTexto(lote) {
            let txt = '';
            if (lote.rua) txt += lote.rua;
            if (lote.numero) txt += ` Nº ${lote.numero}`;
            if (lote.quadra || lote.lote) txt += ` / QD ${lote.quadra || '-'} LT ${lote.lote || '-'}`;
            return txt.trim();
        }

        function distanciaEntrePontos(a, b) {
            return map.distance([a.lat, a.lng], [b.lat, b.lng]);
        }

        function calcularVelocidadePorGps(lat, lng, accuracy, speedMs) {
            const agora = Date.now();
            let velocidadeKmh = 0;
            if (typeof speedMs === 'number' && Number.isFinite(speedMs) && speedMs >= 0) velocidadeKmh = speedMs * 3.6;
            if (ultimaPosicaoMonitoramento && ultimoTempoMonitoramento) {
                const distancia = distanciaEntrePontos(ultimaPosicaoMonitoramento, { lat, lng });
                const segundos = Math.max(1, (agora - ultimoTempoMonitoramento) / 1000);
                if ((!velocidadeKmh || velocidadeKmh < 1) && accuracy <= 120 && distancia >= 4) {
                    velocidadeKmh = (distancia / segundos) * 3.6;
                }
            }
            ultimaPosicaoMonitoramento = { lat, lng };
            ultimoTempoMonitoramento = agora;
            ultimaVelocidadeCalculadaKmh = velocidadeKmh;
            return velocidadeKmh;
        }

        async function verificarVisitanteParado(lat, lng) {
            const agora = Date.now();
            if (!ultimaPosicaoValida) { paradaIniciadaEm = agora; return; }
            const distancia = distanciaEntrePontos(ultimaPosicaoValida, { lat, lng });
            if (distancia <= DISTANCIA_PARADO_METROS) {
                if (!paradaIniciadaEm) paradaIniciadaEm = agora;
                const tempoParado = agora - paradaIniciadaEm;
                if (tempoParado >= TEMPO_PARADO_ALERTA_MS && agora - ultimoParadoEm > 30000) {
                    ultimoParadoEm = agora;
                    mostrarAlerta('warning', 'Visitante parado há mais de 30 segundos. A central foi notificada.');
                    await registrarEventoOperacional('visitante_parado', 'Visitante parado na rota',
                        `Visitante ficou parado por aproximadamente ${Math.round(tempoParado / 1000)} segundos durante a navegação.`, 'media');
                    if (visitaAtualId) await apiPatch(`/public/visitas/${visitaAtualId}`, { status: 'parado' }).catch(console.error);
                }
            } else {
                paradaIniciadaEm = agora;
            }
        }

        function distanciaMetros(lat1, lon1, lat2, lon2) {
            const R = 6371000, toRad = deg => deg * Math.PI / 180;
            const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function distanciaPontoSegmentoMetros(px, py, x1, y1, x2, y2) {
            const toXY = (lat, lng) => ({ x: lng * 111320 * Math.cos(lat * Math.PI / 180), y: lat * 111320 });
            const p = toXY(px, py), a = toXY(x1, y1), b = toXY(x2, y2);
            const abx = b.x - a.x, aby = b.y - a.y, apx = p.x - a.x, apy = p.y - a.y;
            const ab2 = abx * abx + aby * aby;
            let t = ab2 === 0 ? 0 : (apx * abx + apy * aby) / ab2;
            t = Math.max(0, Math.min(1, t));
            return Math.sqrt((p.x - (a.x + abx * t))**2 + (p.y - (a.y + aby * t))**2);
        }

        function distanciaDaRota(lat, lng) {
            const coords = window.rotaAtualCoords || [];
            if (coords.length < 2) return 0;
            let menor = Infinity;
            for (let i = 0; i < coords.length - 1; i++) {
                const dist = distanciaPontoSegmentoMetros(lat, lng, coords[i][0], coords[i][1], coords[i+1][0], coords[i+1][1]);
                if (dist < menor) menor = dist;
            }
            return menor;
        }

        async function verificarVelocidade(speedKmh) {
            const velocidade = Number(speedKmh || 0);
            if (!velocidade || velocidade <= LIMITE_VELOCIDADE_KMH) return;
            const agora = Date.now();
            if (agora - ultimoExcessoVelocidadeEm < 15000) return;
            ultimoExcessoVelocidadeEm = agora;
            mostrarAlerta('danger', `Velocidade acima do limite: ${velocidade.toFixed(1)} km/h. Máximo: ${LIMITE_VELOCIDADE_KMH} km/h.`);
            await registrarEventoOperacional('excesso_velocidade', 'Excesso de velocidade detectado',
                `Visitante acima de ${LIMITE_VELOCIDADE_KMH} km/h. Velocidade: ${velocidade.toFixed(1)} km/h.`, 'alta');
            if (visitaAtualId) await apiPatch(`/public/visitas/${visitaAtualId}`, { status: 'excesso_velocidade' }).catch(console.error);
        }

        async function verificarDesvio(lat, lng, accuracy = 0) {
            if (!window.rotaAtualCoords || !destinoAtualCoords) return;
            const distRota = distanciaDaRota(lat, lng);
            const tolerancia = Math.max(DISTANCIA_DESVIO_METROS, Number(accuracy || 0) * 0.55);
            if (distRota <= tolerancia) return;
            const agora = Date.now();
            if (agora - ultimoDesvioEm < 15000) return;
            ultimoDesvioEm = agora;
            mostrarAlerta('danger', `Visitante saiu da rota (${distRota.toFixed(0)}m). Rota recalculada.`);
            document.getElementById('status-rota').innerText = 'Desvio detectado. Rota recalculada automaticamente.';
            await registrarEventoOperacional('desvio_rota', 'Desvio de rota detectado',
                `Visitante saiu da rota prevista. Distância da rota: ${distRota.toFixed(0)} metros.`, 'alta');
            if (visitaAtualId) await apiPatch(`/public/visitas/${visitaAtualId}`, { status: 'desvio' }).catch(console.error);
            await tracarRotaAteDestino(destinoAtualCoords[0], destinoAtualCoords[1]);
        }

        function verificarChegada(lat, lng) {
            if (!destinoAtualCoords || destinoChegou || visitaEncerradaAutomaticamente) return;
            const dist = distanciaMetros(lat, lng, destinoAtualCoords[0], destinoAtualCoords[1]);
            if (dist <= DISTANCIA_CHEGADA_METROS) {
                destinoChegou = true;
                if (rotaModo === 'destino') {
                    mostrarAlerta('success', 'Você chegou ao destino. Rota de retorno à portaria iniciada automaticamente.');
                    document.getElementById('status-rota').innerText = 'Destino alcançado. Calculando retorno à portaria...';
                    marcarChegada();
                    if (!avisoChegadaDestinoMostrado) {
                        avisoChegadaDestinoMostrado = true;
                        setTimeout(() => alert('Você chegou ao destino. Agora siga a rota de volta até a portaria.'), 250);
                    }
                    if (!retornoAutomaticoIniciado) {
                        retornoAutomaticoIniciado = true;
                        setTimeout(() => retornarPortaria(true), 1200);
                    }
                } else if (rotaModo === 'retorno') {
                    mostrarAlerta('success', 'Você chegou à portaria. A visita será encerrada automaticamente.');
                    document.getElementById('status-rota').innerText = 'Chegada à portaria confirmada. Encerrando visita...';
                    marcarChegadaPortaria();
                }
            }
        }

        async function marcarChegada() {
            if (!visitaAtualId) return;
            try {
                await apiPatch(`/public/visitas/${visitaAtualId}`, {
                    status: 'chegou_destino',
                    horario_chegada_destino: new Date().toISOString()
                });
                await registrarEventoOperacional('chegada_destino', 'Visitante chegou ao destino',
                    'O visitante alcançou o lote de destino. O retorno à portaria foi iniciado automaticamente.', 'baixa');
            } catch (err) { console.error(err); }
        }

        async function marcarChegadaPortaria() {
            if (!visitaAtualId || visitaEncerradaAutomaticamente) return;
            visitaEncerradaAutomaticamente = true;
            try {
                await apiPatch(`/public/visitas/${visitaAtualId}`, {
                    status: 'retornou_portaria',
                    horario_chegada_portaria: new Date().toISOString()
                });
                await registrarEventoOperacional('retorno_portaria_concluido', 'Visitante retornou à portaria',
                    'O visitante retornou à portaria e a visita foi encerrada automaticamente.', 'baixa');
                await encerrarVisita(true);
            } catch (err) {
                console.error(err);
                visitaEncerradaAutomaticamente = false;
            }
        }

        async function registrarEventoOperacional(tipoEvento, titulo, descricao, prioridade = 'normal') {
            if (!condominioAtual || !visitaAtualId || !minhaPosicaoAtual) return;
            try {
                await apiPost('/eventos-operacionais', {
                    condominio_id: condominioAtual.id,
                    tipo_origem: 'visitante',
                    origem_id: visitaAtualId,
                    tipo_evento: tipoEvento,
                    titulo: titulo,
                    descricao: descricao,
                    latitude: minhaPosicaoAtual.lat,
                    longitude: minhaPosicaoAtual.lng,
                    prioridade: prioridade
                });
            } catch (err) { /* silencioso */ }
        }

        async function enviarPosicaoTempoReal(lat, lng, accuracy, speedKmh) {
            if (!condominioAtual || !visitaAtualId) return;
            try {
                await apiPost('/posicoes-tempo-real', {
                    condominio_id: condominioAtual.id,
                    tipo_entidade: 'visitante',
                    entidade_id: visitaAtualId,
                    latitude: lat,
                    longitude: lng,
                    precisao: accuracy || null,
                    velocidade: speedKmh || null,
                    bateria: null
                });
                await apiPatch(`/public/visitas/${visitaAtualId}`, {
                    latitude_atual: lat,
                    longitude_atual: lng
                });
            } catch (err) { /* silencioso */ }
        }

        function iniciarRastreamentoVisitante(centralizar = false) {
            if (!navigator.geolocation) { alert('Este celular não suporta localização.'); return; }
            if (geolocationWatchId) return;

            document.getElementById('status-rota').innerText = 'Ative a localização do celular e aguarde o GPS iniciar...';

            geolocationWatchId = navigator.geolocation.watchPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy || 999;
                    const speedMs = position.coords.speed;

                    if (accuracy > 200) {
                        document.getElementById('status-rota').innerText = `GPS muito fraco (${Math.round(accuracy)}m). Aguarde melhorar.`;
                        return;
                    }

                    if (accuracy > 50) {
                        document.getElementById('status-rota').innerText = `GPS aproximado (${Math.round(accuracy)}m).`;
                    }

                    const novaPosicao = { lat, lng };

                    if (ultimaPosicaoValida) {
                        const distanciaSalto = distanciaEntrePontos(ultimaPosicaoValida, novaPosicao);
                        if (distanciaSalto > 250 && accuracy > 100) {
                            document.getElementById('status-rota').innerText = 'GPS oscilando. Aguardando posição mais estável...';
                            return;
                        }
                    }

                    const velocidadeKmh = calcularVelocidadePorGps(lat, lng, accuracy, speedMs);
                    minhaPosicaoAtual = novaPosicao;
                    atualizarMarcadorVisitante(lat, lng, centralizar);

                    if (modoNavegacaoAtivo || destinoAtualCoords) {
                        centralizarMapaNoVisitante(lat, lng, true);
                    } else if (centralizar) {
                        centralizarMapaNoVisitante(lat, lng, true);
                    }

                    centralizar = false;

                    if (accuracy <= 50) {
                        document.getElementById('status-rota').innerText = `GPS preciso: ${Math.round(accuracy)}m`;
                    }

                    await verificarVisitanteParado(lat, lng);
                    await verificarVelocidade(velocidadeKmh);

                    if (destinoAtualCoords) {
                        verificarChegada(lat, lng);
                        await verificarDesvio(lat, lng, accuracy);
                    }

                    ultimaPosicaoValida = novaPosicao;

                    const agora = Date.now();
                    if (agora - ultimoEnvioPosicao < 3000) return;
                    ultimoEnvioPosicao = agora;
                    await enviarPosicaoTempoReal(lat, lng, accuracy, velocidadeKmh);
                },
                (error) => {
                    let msg = 'Não foi possível obter sua localização.';
                    if (error.code === 1) msg = 'Permissão de localização negada. Ative a localização do navegador.';
                    else if (error.code === 2) msg = 'GPS indisponível. Ative o GPS do celular.';
                    else if (error.code === 3) msg = 'GPS demorou para responder. Tente novamente.';
                    document.getElementById('status-rota').innerText = msg;
                    alert(msg);
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
            );
        }

        function centralizarNaMinhaPosicao() {
            if (!map) return;
            if (minhaPosicaoAtual) {
                modoNavegacaoAtivo = true;
                centralizarMapaNoVisitante(minhaPosicaoAtual.lat, minhaPosicaoAtual.lng, true);
                return;
            }
            const portaria = getPortariaCoords();
            map.flyTo(portaria, ZOOM_NAVEGACAO, { duration: 0.8 });
        }

        async function retornarPortaria(automatico = false) {
            if (!minhaPosicaoAtual) {
                if (!automatico) alert('Aguardando sua localização atual.');
                return;
            }
            const portaria = getPortariaCoords();
            rotaModo = 'retorno';
            destinoChegou = false;
            destinoAtualCoords = [portaria[0], portaria[1]];
            modoNavegacaoAtivo = true;

            mostrarAlerta('warning', automatico ? 'Rota de retorno à portaria iniciada automaticamente.' : 'Retorno à portaria iniciado.');
            document.getElementById('info-destino').innerHTML = '<b>Retorno à portaria</b><br>Siga a rota exibida no mapa para voltar ao ponto inicial.';

            // Abre mapa externo para navegação de retorno
            abrirNavegacaoExterna(
                { lat: Number(minhaPosicaoAtual.lat), lng: Number(minhaPosicaoAtual.lng) },
                { lat: portaria[0], lng: portaria[1] }
            );

            await tracarRotaAteDestino(portaria[0], portaria[1]);
            if (isMobile()) togglePainelMapa(true);

            if (visitaAtualId) {
                await apiPatch(`/public/visitas/${visitaAtualId}`, { status: 'retornando_portaria' }).catch(console.error);
                await registrarEventoOperacional('retorno_portaria',
                    automatico ? 'Retorno automático à portaria iniciado' : 'Retorno à portaria iniciado',
                    automatico ? 'O retorno à portaria foi iniciado automaticamente após a chegada ao destino.' : 'O visitante iniciou o retorno à portaria pelo aplicativo.',
                    'baixa');
            }
        }

        async function encerrarVisita(automatico = false) {
            if (!visitaAtualId) { location.reload(); return; }
            try {
                await apiPatch(`/public/visitas/${visitaAtualId}`, {
                    status: 'finalizada',
                    finalizada_em: new Date().toISOString()
                });
                if (geolocationWatchId) {
                    navigator.geolocation.clearWatch(geolocationWatchId);
                    geolocationWatchId = null;
                }
                mostrarAlerta('success', automatico ? 'Visita encerrada automaticamente na portaria.' : 'Visita encerrada com sucesso.');
                alert(automatico ? 'Você chegou à portaria. Visita encerrada automaticamente.' : 'Visita encerrada com sucesso.');
                location.reload();
            } catch (err) {
                console.error(err);
                alert('Erro ao encerrar visita.');
            }
        }

        function limparBusca() {
            document.getElementById('input-num').value = '';
            document.getElementById('input-lote').value = '';
            document.getElementById('info-destino').innerHTML = 'Selecione o destino para traçar a rota.';
            document.getElementById('status-rota').innerText = '';
            limparAlerta();
            loteDestinoAtual = null;
            destinoAtualCoords = null;
            destinoChegou = false;
            rotaModo = 'destino';
            modoNavegacaoAtivo = false;
            if (map) {
                if (routingControl) { try { map.removeControl(routingControl); } catch(e) {} routingControl = null; }
                if (window.rotaPolyline) { try { map.removeLayer(window.rotaPolyline); } catch(e) {} window.rotaPolyline = null; }
                if (window.rotaPolylineBorda) { try { map.removeLayer(window.rotaPolylineBorda); } catch(e) {} window.rotaPolylineBorda = null; }
                if (destinoMarker) { try { map.removeLayer(destinoMarker); } catch(e) {} destinoMarker = null; }
            }
        }

        // Corrige tamanho do mapa ao mudar orientação (especialmente iOS)
        window.addEventListener('orientationchange', () => {
            [300, 700, 1200].forEach(ms => setTimeout(() => { if (map) map.invalidateSize(true); }, ms));
        });
        window.addEventListener('resize', () => {
            setTimeout(() => { if (map) map.invalidateSize(true); }, 300);
        });

        console.log('✅ visitante.html carregado com sucesso.');
    </script>
</body>
</html>
