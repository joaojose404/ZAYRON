        :root {

        * { box-sizing: border-box; }

function normalizarTexto(valor) {
  return String(valor || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim()
    .toUpperCase();
}

  const res = await fetch(API + url, {

    headers: { 'Accept': 'application/json' }
  });

  if (!res.ok || json.success === false) {
    throw new Error(json.message || json.details || `Erro HTTP ${res.status}`);
  }

  return json.data ?? json;
}

            if (text === null || text === undefined) return '';
            return String(text)

                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')

            const origem = minhaPosicaoAtual || { lat: getPortariaCoords()[0], lng: getPortariaCoords()[1] };

        async function conectarCondominio() {
            const nomeDigitado = document.getElementById('input-condo').value.trim();
            const nomeBusca = normalizarTexto(nomeDigitado);
            const status = document.getElementById('status-condo');

            if (!nomeBusca || nomeBusca.length < 2) {
                status.innerText = 'Digite o nome do condomínio.';
                return;
            }

            status.innerText = 'Buscando condomínio...';

            try {
                const condos = await apiGet(`/public/condominios?busca=${encodeURIComponent(nomeDigitado)}`);
                const listaCondominios = Array.isArray(condos) ? condos : [];

                if (!listaCondominios.length) {
                    status.innerText = 'Condomínio não encontrado.';
                    return;
                }

                condominioAtual =
                    listaCondominios.find(c => normalizarTexto(c.nome) === nomeBusca) ||
                    listaCondominios.find(c => normalizarTexto(c.nome).includes(nomeBusca)) ||
                    listaCondominios.find(c => nomeBusca.includes(normalizarTexto(c.nome))) ||
                    listaCondominios[0];

                if (!condominioAtual || !condominioAtual.id) {
                    status.innerText = 'Condomínio não encontrado.';
                    return;
                }

                status.innerText = `Condomínio encontrado: ${condominioAtual.nome}. Carregando unidades...`;

                const lotes = await apiGet(`/public/lotes?condominio_id=${encodeURIComponent(condominioAtual.id)}`);
                lotesCondominio = Array.isArray(lotes) ? lotes : [];

                if (!lotesCondominio.length) {
                    status.innerText = 'Este condomínio não possui unidades cadastradas na nuvem.';
                    return;
                }

                status.innerText = `Condomínio encontrado: ${condominioAtual.nome}`;
                setTimeout(() => {
                    document.getElementById('step-condo').classList.add('hidden');
                    document.getElementById('step-ident').classList.remove('hidden');
                }, 300);
            } catch (err) {
                console.error('Erro ao conectar condomínio:', err);
                status.innerText = `Falha de conexão: ${err.message}`;
            }
        }

        function getPortariaCoords() {
            if (condominioAtual?.portaria_latitude != null && condominioAtual?.portaria_longitude != null) {
                return [Number(condominioAtual.portaria_latitude), Number(condominioAtual.portaria_longitude)];
            }
            return [-23.201903, -47.029268];
        }

    function iniciarMapa() {

    const portaria =
        getPortariaCoords();

    if (map) return;

    map =
        new mapboxgl.Map({
            container: 'map',

            style:
            'mapbox://styles/mapbox/satellite-streets-v12',

            center: [
                Number(portaria[1]),
                Number(portaria[0])
            ],

            zoom: 19,

            pitch: 60,

            bearing: 0
        });

    document
    .getElementById('btnBussola')
    .addEventListener('click', () => {

        rotacaoManual += 45;

        if (
            rotacaoManual >= 360
        ) {
            rotacaoManual = 0;
        }

        map.easeTo({
            bearing:
                rotacaoManual,
            duration: 500
        });

    });

async function tracarRotaAteDestino(destLat, destLng) {

    const origem = obterOrigemRota();

    const url =
`https://api.mapbox.com/directions/v5/mapbox/driving/
${origem[1]},${origem[0]};
${destLng},${destLat}
?geometries=geojson
&overview=full
&access_token=${mapboxgl.accessToken}`;

    const response =
        await fetch(url);

    const data =
        await response.json();

    const rota =
        data.routes[0].geometry;

    if (
        map.getSource('rota')
    ) {

        map.getSource('rota')
            .setData({
                type: 'Feature',
                geometry: rota
            });

        map.addSource(
            'rota',
            {
                type: 'geojson',
                data: {
                    type: 'Feature',
                    geometry: rota
                }

        map.addLayer({
            id: 'rota',
            type: 'line',
            source: 'rota',

                'line-width': 6
            }

       function distanciaEntrePontos(a, b) {

    const p1 = new google.maps.LatLng(
        Number(a.lat),
        Number(a.lng)
    );

    const p2 = new google.maps.LatLng(

     function calcularVelocidadePorGps(lat, lng, accuracy, speedMs) {

    const agora = Date.now();
    let velocidadeKmh = 0;
    let distancia = 0;
    let segundos = 0;

    // Velocidade fornecida pelo GPS do aparelho
    if (
        typeof speedMs === 'number' &&
        Number.isFinite(speedMs) &&
        speedMs >= 0
    ) {
        velocidadeKmh = speedMs * 3.6;
    }

    // Se não veio velocidade do GPS, calcula pela distância percorrida
    if (ultimaPosicaoMonitoramento && ultimoTempoMonitoramento) {

        try {

            distancia = distanciaEntrePontos(
                ultimaPosicaoMonitoramento,
                { lat, lng }
            );

            segundos = Math.max(
                1,
                (agora - ultimoTempoMonitoramento) / 1000
            );

            if (
                (!velocidadeKmh || velocidadeKmh < 1) &&
                accuracy <= 120 &&
                distancia >= 1
            ) {
                velocidadeKmh =
                    (distancia / segundos) * 3.6;
            }

        } catch (err) {
            console.error(
                'Erro ao calcular distância:',
                err
            );
        }
    }

    // Nunca permitir NaN
    velocidadeKmh = Number(velocidadeKmh);

    if (!Number.isFinite(velocidadeKmh)) {
        velocidadeKmh = 0;
    }

    // Debug visível na tela
    const status = document.getElementById('status-rota');

    if (status) {

        status.innerText =
            `GPS=${Math.round(accuracy || 0)}m | ` +
            `speedMs=${speedMs} | ` +
            `dist=${Math.round(distancia)}m | ` +
            `vel=${velocidadeKmh.toFixed(1)} km/h`;

    }

    console.log('GPS DEBUG');
    console.log('Latitude:', lat);
    console.log('Longitude:', lng);
    console.log('Accuracy:', accuracy);
    console.log('SpeedMs:', speedMs);
    console.log('Distância:', distancia);
    console.log('Segundos:', segundos);
    console.log('Velocidade Final:', velocidadeKmh);

    ultimaPosicaoMonitoramento = {
        lat,
        lng
    };

    ultimoTempoMonitoramento = agora;

    ultimaVelocidadeCalculadaKmh = velocidadeKmh;

    return velocidadeKmh;
}

        function distanciaMetros(lat1, lon1, lat2, lon2) {
            const R = 6371000, toRad = deg => deg * Math.PI / 180;
            const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function distanciaPontoSegmentoMetros(px, py, x1, y1, x2, y2) {
            const toXY = (lat, lng) => ({ x: lng * 111320 * Math.cos(lat * Math.PI / 180), y: lat * 111320 });
            const p = toXY(px, py), a = toXY(x1, y1), b = toXY(x2, y2);
            const abx = b.x-a.x, aby = b.y-a.y, apx = p.x-a.x, apy = p.y-a.y;
            const ab2 = abx*abx + aby*aby;
            let t = ab2 === 0 ? 0 : (apx*abx + apy*aby) / ab2;
            t = Math.max(0, Math.min(1, t));
            return Math.sqrt((p.x-(a.x+abx*t))**2 + (p.y-(a.y+aby*t))**2);
        }

        function distanciaDaRota(lat, lng) {
            const coords = window.rotaAtualCoords || [];
            if (coords.length < 2) return 0;
            let menor = Infinity;
            for (let i = 0; i < coords.length - 1; i++) {
                const dist = distanciaPontoSegmentoMetros(lat, lng, coords[i][0], coords[i][1], coords[i+1][0], coords[i+1][1]);
                if (dist < menor) menor = dist;
            }
            return menor;
        }

            await registrarEventoOperacional('excesso_velocidade', 'Excesso de velocidade detectado',

            if (visitaAtualId) await apiPatch(`/public/visitas/${visitaAtualId}`, { status: 'excesso_velocidade' });
        }

            if (distRota <= tolerancia) return;
            const agora = Date.now();

            document.getElementById('info-destino').innerHTML = '<b>Retorno à portaria</b><br>Siga a rota exibida no mapa para voltar ao ponto inicial.';
            await tracarRotaAteDestino(portaria[0], portaria[1], true);
            if (isMobile()) togglePainelMapa(true);
            if (visitaAtualId) {
                await apiPatch(`/public/visitas/${visitaAtualId}`, { status: 'retornando_portaria' });
                await registrarEventoOperacional('retorno_portaria',
                    automatico ? 'Retorno automático à portaria iniciado' : 'Retorno à portaria iniciado',
                    automatico ? 'O retorno foi iniciado automaticamente.' : 'O visitante iniciou o retorno.', 'baixa');
            }
        }

        async function encerrarVisita(automatico = false) {
            if (!visitaAtualId) { location.reload(); return; }
            try {
                await apiPatch(`/public/visitas/${visitaAtualId}`, { status: 'finalizada', finalizada_em: new Date().toISOString() });
                if (geolocationWatchId) { navigator.geolocation.clearWatch(geolocationWatchId); geolocationWatchId = null; }
                mostrarAlerta('success', automatico ? 'Visita encerrada automaticamente na portaria.' : 'Visita encerrada com sucesso.');
                alert(automatico ? 'Você chegou à portaria. Visita encerrada automaticamente.' : 'Visita encerrada com sucesso.');
                location.reload();
            } catch (err) { console.error(err); alert('Erro ao encerrar visita.'); }
        }

        function limparBusca() {
            document.getElementById('input-num').value = '';
            document.getElementById('input-lote').value = '';
            document.getElementById('info-destino').innerHTML = 'Selecione o destino para traçar a rota.';
            document.getElementById('status-rota').innerText = '';
            limparAlerta();
            loteDestinoAtual = null;
            destinoAtualCoords = null;
            destinoChegou = false;
            rotaModo = 'destino';
            modoNavegacaoAtivo = false;
            if (routingControl) { map.removeControl(routingControl); routingControl = null; }
            if (window.rotaPolyline) { map.removeLayer(window.rotaPolyline); window.rotaPolyline = null; }
            if (window.rotaPolylineBorda) { map.removeLayer(window.rotaPolylineBorda); window.rotaPolylineBorda = null; }
            if (destinoMarker) { map.removeLayer(destinoMarker); destinoMarker = null; }
        }

let visitanteMarkerRealGpsZayron = null;

function zayronCoordValida(lat, lng) {
    lat = Number(lat); lng = Number(lng);
    return Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180;
}

function zayronDistanciaMetrosPontos(a, b) {
    const R = 6371000, rad = v => v * Math.PI / 180;
    const dLat = rad(b.lat-a.lat), dLng = rad(b.lng-a.lng);
    const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
    return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
}

function zayronProjetarNaRota(p, a, b) {
    const dx = b.lng-a.lng, dy = b.lat-a.lat;
    if (dx===0 && dy===0) return {lat:a.lat,lng:a.lng};
    let t = ((p.lng-a.lng)*dx+(p.lat-a.lat)*dy)/(dx*dx+dy*dy);
    t = Math.max(0,Math.min(1,t));
    return {lat:a.lat+t*dy,lng:a.lng+t*dx};
}

function zayronNormalizarRota(coords) {
    return (coords||[]).map(c => Array.isArray(c) ? {lat:Number(c[0]),lng:Number(c[1])} : {lat:Number(c.lat??c.latitude),lng:Number(c.lng??c.longitude)}).filter(p => zayronCoordValida(p.lat,p.lng));
}

function zayronSnapNaRota(lat, lng) {
    const rota = zayronNormalizarRota(window.rotaAtualCoords||[]);
    const real = {lat:Number(lat),lng:Number(lng)};
    if (!zayronCoordValida(real.lat,real.lng)||rota.length<2) return {ponto:real,distancia:0};
    let melhor = {ponto:real,distancia:Infinity};
    for (let i=0;i<rota.length-1;i++) {
        const projetado = zayronProjetarNaRota(real,rota[i],rota[i+1]);
        const dist = zayronDistanciaMetrosPontos(real,projetado);
        if (dist<melhor.distancia) melhor={ponto:projetado,distancia:dist};
    }
    return melhor;
}

function zayronPosicaoExibidaVisitante(lat, lng) {
    const snap = zayronSnapNaRota(lat,lng);
    if ((window.rotaAtualCoords||[]).length>=2 && snap.ponto && zayronCoordValida(snap.ponto.lat,snap.ponto.lng)) return snap.ponto;
    return {lat:Number(lat),lng:Number(lng)};
}

function zayronAnimarMarcador(marker, destino) {
    if (!marker||!destino) return;
    const atual = marker.getLatLng();
    const inicio = {lat:atual.lat,lng:atual.lng};
    const fim = {lat:Number(destino.lat),lng:Number(destino.lng)};
    if (!zayronCoordValida(fim.lat,fim.lng)) return;
    const frames = 14; let frame = 0;
    if (marker._zayronAnimTimer) clearInterval(marker._zayronAnimTimer);
    marker._zayronAnimTimer = setInterval(() => {
        frame++;
        const t = Math.min(1,frame/frames);
        const ease = t<0.5 ? 2*t*t : -1+(4-2*t)*t;
        marker.setLatLng([inicio.lat+(fim.lat-inicio.lat)*ease,inicio.lng+(fim.lng-inicio.lng)*ease]);
        if (frame>=frames) { clearInterval(marker._zayronAnimTimer); marker._zayronAnimTimer=null; }
    }, 24);
}

function zayronLimparRotaAtual() {
    if (routingControl) { try{map.removeControl(routingControl);}catch(e){} routingControl=null; }
    if (window.rotaPolyline) { try{map.removeLayer(window.rotaPolyline);}catch(e){} window.rotaPolyline=null; }
    if (window.rotaPolylineBorda) { try{map.removeLayer(window.rotaPolylineBorda);}catch(e){} window.rotaPolylineBorda=null; }
    if (destinoMarker) { try{map.removeLayer(destinoMarker);}catch(e){} destinoMarker=null; }
}

    if (rotaModo !== 'destino') return;

function abrirGoogleMapsNavegacao() {

    if (!destinoAtualCoords) {
        alert('Destino não definido.');
        return;
    }

    if (!minhaPosicaoAtual) {
        alert('Localização atual não encontrada.');
        return;
    }

    const origemLat = minhaPosicaoAtual.lat;
    const origemLng = minhaPosicaoAtual.lng;

    const destinoLat = destinoAtualCoords[0];
    const destinoLng = destinoAtualCoords[1];

    const url =
        `https://www.google.com/maps/dir/?api=1` +
        `&origin=${origemLat},${origemLng}` +
        `&destination=${destinoLat},${destinoLng}` +
        `&travelmode=driving`;

    window.open(url, '_blank');
}
