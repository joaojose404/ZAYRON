<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Navegação Visitante - Secure Tech</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    

    <style>
        :root {
            --navy: #020617;
            --lead: rgba(30, 41, 59, 0.95);
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: rgba(255,255,255,0.12);
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: "Segoe UI", sans-serif;
            background: var(--navy);
            overflow: hidden;
            color: var(--text);
        }

        #map {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 20;
            width: min(420px, calc(100vw - 28px));
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel {
            background: var(--lead);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 12px 32px rgba(0,0,0,.3);
            backdrop-filter: blur(6px);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 700;
            color: #dbeafe;
        }

        .mini-btn {
            width: auto;
            padding: 8px 10px;
            font-size: 11px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.08);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .container-login {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            background: var(--navy);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 15px;
            width: 88%;
            max-width: 360px;
            text-align: center;
            color: white;
            box-shadow: 0 12px 32px rgba(0,0,0,.35);
        }

        .title {
            font-size: 22px;
            color: var(--accent);
            margin: 0 0 6px 0;
        }

        .subtitle {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 18px;
        }

        .tab-buttons {
            display: flex;
            gap: 6px;
        }

        .tab-btn {
            background: rgba(255,255,255,0.08);
            font-size: 11px;
            padding: 10px;
            flex: 1;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .tab-btn.active {
            background: var(--accent);
        }

        input, select, button {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            background: var(--lead);
            color: white;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(59,130,246,.18);
        }

        button {
            cursor: pointer;
            font-weight: bold;
        }

        button.primary {
            background: var(--accent);
            border: none;
        }

        button.success {
            background: var(--success);
            border: none;
        }

        button.warning {
            background: var(--warning);
            color: #111827;
            border: none;
        }

        .hidden {
            display: none !important;
        }

        .info-box {
            font-size: 12px;
            line-height: 1.5;
            color: #e2e8f0;
        }

        .status-line {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            min-height: 18px;
        }

        .alert-box {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            display: none;
        }

        .alert-box.show {
            display: block;
        }

        .alert-success {
            background: rgba(16,185,129,0.15);
            border: 1px solid rgba(16,185,129,0.45);
            color: #d1fae5;
        }

        .alert-warning {
            background: rgba(245,158,11,0.15);
            border: 1px solid rgba(245,158,11,0.45);
            color: #fde68a;
        }

        .alert-danger {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.45);
            color: #fecaca;
        }

        .leaflet-routing-container {
            display: none;
        }

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #0f172a;
            color: white;
        }

        @media (max-width: 700px) {
            .overlay {
                top: auto;
                left: 10px;
                right: 10px;
                bottom: 10px;
                width: auto;
                max-width: none;
            }

            .panel {
                padding: 12px;
                max-height: 40vh;
                overflow-y: auto;
            }

            .panel.reduced {
                max-height: 72px;
                overflow: hidden;
            }

            .panel.reduced .panel-body {
                display: none;
            }

            .tab-btn {
                padding: 12px 8px;
                font-size: 10px;
            }

            .container-login {
                width: calc(100vw - 24px);
                max-width: none;
            }
        }
    </style>
</head>
<body>

    <div id="step-condo" class="container-login">
        <h2 class="title">Acesso</h2>
        <div class="subtitle">Digite o nome do condomínio</div>

        <input
            type="text"
            id="input-condo"
            placeholder="CONDOMÍNIO"
            oninput="limparStatusCondominio()"
            onkeydown="if(event.key==='Enter'){conectarCondominio()}"
        />

        <button class="primary" style="margin-top:10px;" onclick="conectarCondominio()">Continuar</button>
        <div id="status-condo" class="status-line" style="margin-top:12px;"></div>
    </div>

    <div id="step-ident" class="container-login hidden">
        <h2 class="title">Identificação</h2>
        <div class="subtitle">Preencha seus dados para iniciar a navegação</div>

        <input type="text" id="input-nome" placeholder="SEU NOME" />
        <input type="text" id="input-placa" placeholder="PLACA (OBRIGATÓRIA)" />
        <input type="text" id="input-liberado-por" placeholder="LIBERADO POR" />

        <button class="primary" style="margin-top:10px;" onclick="irParaMapa()">Iniciar</button>
    </div>

    <div id="step-mapa" class="overlay hidden">
        <div class="panel" id="painel-mapa">
            <div class="panel-header">
                <div class="panel-title">Navegação do Visitante</div>
                <button class="mini-btn" onclick="togglePainelMapa()" id="btn-toggle-painel">Ocultar</button>
            </div>

            <div class="panel-body">
                <div class="tab-buttons">
                    <button class="tab-btn active" id="btn-rua" onclick="switchTab('rua')">RUA / Nº</button>
                    <button class="tab-btn" id="btn-quadra" onclick="switchTab('quadra')">QUADRA / LOTE</button>
                </div>

                <div id="busca-rua" style="margin-top:10px;">
                    <select id="select-rua" onchange="limparBusca()">
                        <option value="">SELECIONE A RUA</option>
                    </select>
                    <input type="text" id="input-num" placeholder="NÚMERO" oninput="buscarDestino('rua')" />
                </div>

                <div id="busca-quadra" class="hidden" style="margin-top:10px;">
                    <select id="select-quadra" onchange="limparBusca()">
                        <option value="">SELECIONE A QUADRA</option>
                    </select>
                    <input type="text" id="input-lote" placeholder="LOTE" oninput="buscarDestino('quadra')" />
                </div>

                <div class="info-box" id="info-destino" style="margin-top:12px;">
                    Selecione o destino para traçar a rota.
                </div>

                <div class="status-line" id="status-rota" style="margin-top:10px;"></div>
                <div id="alerta-box" class="alert-box"></div>

                <div style="margin-top:10px; display:flex; gap:8px;">
                    <button class="success" onclick="centralizarNaMinhaPosicao()">Minha posição</button>
                    <button class="warning" onclick="retornarPortaria()">Retornar à Portaria</button>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script>
       const API = "https://zayron-api-1011701557501.southamerica-east1.run.app";

function normalizarTexto(valor) {
  return String(valor || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim()
    .toUpperCase();
}

async function apiGet(url){
  const res = await fetch(API + url, {
    method: 'GET',
    headers: { 'Accept': 'application/json' }
  });

  const json = await res.json().catch(() => ({}));

  if (!res.ok || json.success === false) {
    throw new Error(json.message || json.details || `Erro HTTP ${res.status}`);
  }

  return json.data ?? json;
}

async function apiPost(url, body){
  const res = await fetch(API + url,{
    method:"POST",
    headers:{
      'Content-Type':'application/json',
      'Accept':'application/json'
    },
    body:JSON.stringify(body)
  });

  const json = await res.json().catch(() => ({}));

  if (!res.ok || json.success === false) {
    throw new Error(json.message || json.details || `Erro HTTP ${res.status}`);
  }

  return json.data ?? json;
}

async function apiPatch(url, body){
  const res = await fetch(API + url,{
    method:"PATCH",
    headers:{
      'Content-Type':'application/json',
      'Accept':'application/json'
    },
    body:JSON.stringify(body)
  });

  const json = await res.json().catch(() => ({}));

  if (!res.ok || json.success === false) {
    throw new Error(json.message || json.details || `Erro HTTP ${res.status}`);
  }

  return json.data ?? json;
}

        let map = null;
        let routingControl = null;
        let portariaMarker = null;
        let destinoMarker = null;
        let visitanteMarker = null;

        let condominioAtual = null;
        let lotesCondominio = [];
        let visitaAtualId = null;
        let loteDestinoAtual = null;
        let geolocationWatchId = null;
        let ultimoEnvioPosicao = 0;
        let minhaPosicaoAtual = null;
        let horarioEntradaSistemaLocal = null;

        let rotaModo = 'destino';
        let destinoAtualCoords = null;
        let destinoChegou = false;
        let ultimoDesvioEm = 0;
        let ultimoExcessoVelocidadeEm = 0;
        let ultimoParadoEm = 0;
        let paradaIniciadaEm = null;
        let ultimoTempoMonitoramento = null;
        let ultimaPosicaoMonitoramento = null;
        let ultimaVelocidadeCalculadaKmh = 0;
        let ultimaAtualizacaoRotaEm = 0;

        const LIMITE_VELOCIDADE_KMH = 30;
        const TEMPO_PARADO_ALERTA_MS = 30000;
        const DISTANCIA_PARADO_METROS = 3;
        const DISTANCIA_CHEGADA_METROS = 35;
        const DISTANCIA_DESVIO_METROS = 35;
        const INTERVALO_RECALCULO_ROTA_MS = 12000;
        const ZOOM_NAVEGACAO = 20;
        const ZOOM_NAVEGACAO_MOBILE = 20;
        const MAPA_PAINEL_OFFSET_DESKTOP = 210;
        const MAPA_PAINEL_OFFSET_VERTICAL = 130;
        const GOOGLE_SATELLITE_TILE = 'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}';
        let modoNavegacaoAtivo = false;
        let retornoAutomaticoIniciado = false;
        let visitaEncerradaAutomaticamente = false;
        let avisoChegadaDestinoMostrado = false;

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function isMobile() {
            return window.innerWidth <= 700;
        }

        function togglePainelMapa(force = null) {
            const painel = document.getElementById('painel-mapa');
            const botao = document.getElementById('btn-toggle-painel');

            const reduzir = force === null
                ? !painel.classList.contains('reduced')
                : force;

            painel.classList.toggle('reduced', reduzir);
            botao.innerText = reduzir ? 'Mostrar' : 'Ocultar';
        }

        function limparStatusCondominio() {
            document.getElementById('status-condo').innerText = '';
        }

        function mostrarAlerta(tipo, mensagem) {
            const box = document.getElementById('alerta-box');
            box.className = 'alert-box show';
            if (tipo === 'success') box.classList.add('alert-success');
            else if (tipo === 'warning') box.classList.add('alert-warning');
            else box.classList.add('alert-danger');
            box.innerText = mensagem;
        }

        function limparAlerta() {
            const box = document.getElementById('alerta-box');
            box.className = 'alert-box';
            box.innerText = '';
        }

        async function conectarCondominio() {
            const nomeDigitado = document.getElementById('input-condo').value.trim();
            const nomeBusca = normalizarTexto(nomeDigitado);
            const status = document.getElementById('status-condo');

            if (!nomeBusca || nomeBusca.length < 2) {
                status.innerText = 'Digite o nome do condomínio.';
                return;
            }

            status.innerText = 'Buscando condomínio...';

            try {
                const condos = await apiGet(`/public/condominios?busca=${encodeURIComponent(nomeDigitado)}`);
                const listaCondominios = Array.isArray(condos) ? condos : [];

                console.log('Condomínios retornados:', listaCondominios);

                if (!listaCondominios.length) {
                    status.innerText = 'Condomínio não encontrado.';
                    return;
                }

                // Importante: a API pode retornar mais de um condomínio.
                // Aqui escolhemos o que realmente corresponde ao texto digitado,
                // evitando pegar Alpha quando o usuário digitou Terras.
                condominioAtual =
                    listaCondominios.find(c => normalizarTexto(c.nome) === nomeBusca) ||
                    listaCondominios.find(c => normalizarTexto(c.nome).includes(nomeBusca)) ||
                    listaCondominios.find(c => nomeBusca.includes(normalizarTexto(c.nome))) ||
                    listaCondominios[0];

                if (!condominioAtual || !condominioAtual.id) {
                    status.innerText = 'Condomínio não encontrado.';
                    return;
                }

                status.innerText = `Condomínio encontrado: ${condominioAtual.nome}. Carregando unidades...`;

                const lotes = await apiGet(`/public/lotes?condominio_id=${encodeURIComponent(condominioAtual.id)}`);
                lotesCondominio = Array.isArray(lotes) ? lotes : [];

                console.log('Condomínio selecionado:', condominioAtual);
                console.log('Lotes retornados:', lotesCondominio);

                if (!lotesCondominio.length) {
                    status.innerText = 'Este condomínio não possui unidades cadastradas na nuvem.';
                    return;
                }

                status.innerText = `Condomínio encontrado: ${condominioAtual.nome}`;
                setTimeout(() => {
                    document.getElementById('step-condo').classList.add('hidden');
                    document.getElementById('step-ident').classList.remove('hidden');
                }, 300);
            } catch (err) {
                console.error('Erro ao conectar condomínio:', err);
                status.innerText = `Falha de conexão: ${err.message}`;
            }
        }

        async function irParaMapa() {
            const nome = document.getElementById('input-nome').value.trim();
            const placa = document.getElementById('input-placa').value.trim().toUpperCase();
            const liberadoPor = document.getElementById('input-liberado-por').value.trim().toUpperCase();

            if (!nome) {
                alert('Informe seu nome.');
                return;
            }

            if (!placa) {
                alert('Informe a placa do veículo.');
                return;
            }

            if (!liberadoPor) {
                alert('Informe quem liberou a entrada.');
                return;
            }

            horarioEntradaSistemaLocal = new Date().toISOString();

            document.getElementById('step-ident').classList.add('hidden');
            document.getElementById('step-mapa').classList.remove('hidden');

            popularFiltros();
            iniciarMapa();

            if (isMobile()) {
                togglePainelMapa(false);
            }

            if (!navigator.geolocation) {
                alert('Seu dispositivo não suporta localização.');
                return;
            }

            document.getElementById('status-rota').innerText = 'Solicitando sua localização...';

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    minhaPosicaoAtual = {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude
                    };

                    atualizarMarcadorVisitante(minhaPosicaoAtual.lat, minhaPosicaoAtual.lng, true);
                    document.getElementById('status-rota').innerText = 'Localização obtida. Escolha o destino.';
                    iniciarRastreamentoVisitante(true);
                },
                (error) => {
                    console.error('Erro ao obter localização inicial:', error);
                    alert('Ative a localização do celular para iniciar a navegação.');
                    document.getElementById('status-rota').innerText =
                        'Localização não autorizada. Ative o GPS do celular.';
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 15000
                }
            );
        }

        function getPortariaCoords() {
            if (condominioAtual?.portaria_latitude != null && condominioAtual?.portaria_longitude != null) {
                return [Number(condominioAtual.portaria_latitude), Number(condominioAtual.portaria_longitude)];
            }
            return [-23.2066, -47.0348];
        }

        function iniciarMapa() {
            const portaria = getPortariaCoords();

            if (!map) {
                map = L.map('map', {
                    zoomControl: true,
                    maxZoom: 22,
                    zoomSnap: 0.25,
                    zoomDelta: 0.5
                }).setView(portaria, ZOOM_NAVEGACAO);

                L.tileLayer(GOOGLE_SATELLITE_TILE, {
                    maxZoom: 22,
                    maxNativeZoom: 22,
                    attribution: 'Imagens © Google'
                }).addTo(map);

                portariaMarker = L.marker(portaria)
                    .addTo(map)
                    .bindPopup('<b>Portaria</b>');
            } else {
                map.flyTo(portaria, ZOOM_NAVEGACAO, { duration: 0.5 });
            }

            map.whenReady(() => {
                setTimeout(() => {
                    map.invalidateSize();
                }, 500);
            });

            setTimeout(() => map.invalidateSize(), 300);
        }

        function popularFiltros() {
            const selRua = document.getElementById('select-rua');
            const selQuadra = document.getElementById('select-quadra');

            selRua.innerHTML = '<option value="">SELECIONE A RUA</option>';
            selQuadra.innerHTML = '<option value="">SELECIONE A QUADRA</option>';

            const ruas = [...new Set(lotesCondominio.map(c => c.rua).filter(Boolean))].sort();
            const quadras = [...new Set(lotesCondominio.map(c => c.quadra).filter(Boolean))].sort();

            ruas.forEach(r => {
                selRua.innerHTML += `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`;
            });

            quadras.forEach(q => {
                selQuadra.innerHTML += `<option value="${escapeHtml(q)}">${escapeHtml(q)}</option>`;
            });
        }

        function switchTab(tab) {
            document.getElementById('busca-rua').classList.toggle('hidden', tab !== 'rua');
            document.getElementById('busca-quadra').classList.toggle('hidden', tab !== 'quadra');
            document.getElementById('btn-rua').classList.toggle('active', tab === 'rua');
            document.getElementById('btn-quadra').classList.toggle('active', tab === 'quadra');
            limparBusca();
        }

        function buscarDestino(tipo) {
            let lote = null;

            if (tipo === 'rua') {
                const rua = document.getElementById('select-rua').value;
                const numero = document.getElementById('input-num').value.trim();

                if (!rua || !numero) return;

                lote = lotesCondominio.find(c =>
                    c.rua === rua && String(c.numero || '') === String(numero)
                );
            } else {
                const quadra = document.getElementById('select-quadra').value;
                const loteNum = document.getElementById('input-lote').value.trim();

                if (!quadra || !loteNum) return;

                lote = lotesCondominio.find(c =>
                    c.quadra === quadra && String(c.lote || '') === String(loteNum)
                );
            }

            if (!lote) return;

            if (lote.latitude == null || lote.longitude == null) {
                alert('Esta unidade não possui coordenadas cadastradas.');
                return;
            }

            rotaModo = 'destino';
            destinoChegou = false;
            loteDestinoAtual = lote;
            destinoAtualCoords = [Number(lote.latitude), Number(lote.longitude)];
            limparAlerta();

            document.getElementById('info-destino').innerHTML = `
                <b>Destino encontrado</b><br>
                Rua: ${escapeHtml(lote.rua || '-')} ${escapeHtml(lote.numero || '')}<br>
                Quadra: ${escapeHtml(lote.quadra || '-')} | Lote: ${escapeHtml(lote.lote || '-')}
            `;

            tracarRotaAteDestino(destinoAtualCoords[0], destinoAtualCoords[1], true);
            registrarOuAtualizarVisita();

            if (isMobile()) {
                togglePainelMapa(true);
            }
        }

        function obterOrigemRota() {
            if (minhaPosicaoAtual && minhaPosicaoAtual.lat && minhaPosicaoAtual.lng) {
                return [minhaPosicaoAtual.lat, minhaPosicaoAtual.lng];
            }
            return getPortariaCoords();
        }

        function getPaddingMapa() {
            if (isMobile()) {
                return {
                    paddingTopLeft: [20, 20],
                    paddingBottomRight: [20, 220]
                };
            }

            return {
                paddingTopLeft: [450, 30],
                paddingBottomRight: [30, 30]
            };
        }

        function centralizarMapaNoVisitante(lat, lng, animate = true) {
            if (!map || lat == null || lng == null) return;

            const zoom = isMobile() ? ZOOM_NAVEGACAO_MOBILE : ZOOM_NAVEGACAO;
            map.setView([Number(lat), Number(lng)], zoom, { animate });

            // Modo navegação tipo Uber/Google:
            // visitante mais embaixo da tela para mostrar o caminho à frente.
            setTimeout(() => {
                if (!map) return;
                if (isMobile()) {
                    map.panBy([0, MAPA_PAINEL_OFFSET_VERTICAL], { animate: false });
                } else {
                    map.panBy([-MAPA_PAINEL_OFFSET_DESKTOP, MAPA_PAINEL_OFFSET_VERTICAL], { animate: false });
                }
            }, 80);
        }


async function tracarRotaAteDestino(destLat, destLng, forceRecreate = false) {
  if (!map) return;

  const origem = obterOrigemRota();
  modoNavegacaoAtivo = true;

  const origemLat = Number(origem[0]);
  const origemLng = Number(origem[1]);
  const destinoLat = Number(destLat);
  const destinoLng = Number(destLng);

  function limparRotaAtual() {
    if (routingControl) {
      map.removeControl(routingControl);
      routingControl = null;
    }

    if (window.rotaPolyline) {
      map.removeLayer(window.rotaPolyline);
      window.rotaPolyline = null;
    }

    if (window.rotaPolylineBorda) {
      map.removeLayer(window.rotaPolylineBorda);
      window.rotaPolylineBorda = null;
    }

    if (destinoMarker) {
      map.removeLayer(destinoMarker);
      destinoMarker = null;
    }
  }

  function desenharRotaGoogle(coords, mensagem) {
    limparRotaAtual();

    destinoMarker = L.marker([destinoLat, destinoLng])
      .addTo(map)
      .bindPopup(rotaModo === 'retorno' ? '<b>Portaria / Saída</b>' : '<b>Destino</b>');

    window.rotaPolylineBorda = L.polyline(coords, {
      color: '#ffffff',
      weight: 12,
      opacity: 0.95,
      lineJoin: 'round',
      lineCap: 'round'
    }).addTo(map);

    window.rotaPolyline = L.polyline(coords, {
      color: '#2563eb',
      weight: 8,
      opacity: 1,
      lineJoin: 'round',
      lineCap: 'round'
    }).addTo(map);

    rotaAtualCoords = coords;
    window.rotaAtualCoords = coords;
    ultimaAtualizacaoRotaEm = Date.now();

    document.getElementById('status-rota').innerText = mensagem;

    try {
      map.fitBounds(coords, getPaddingMapa());
    } catch {
      centralizarMapaNoVisitante(origemLat, origemLng, false);
    }
  }

  try {
    if (
      !Number.isFinite(origemLat) ||
      !Number.isFinite(origemLng) ||
      !Number.isFinite(destinoLat) ||
      !Number.isFinite(destinoLng)
    ) {
      throw new Error('Coordenadas inválidas para calcular rota.');
    }

    document.getElementById('status-rota').innerText = 'Calculando rota pelo Google Maps...';

    const rotaGoogle = await calcularRotaGoogle(
      { lat: origemLat, lng: origemLng },
      { lat: destinoLat, lng: destinoLng }
    );

    const encoded = rotaGoogle?.polyline?.encodedPolyline;
    if (!encoded) throw new Error('Google Maps não retornou a rota.');

    const coords = decodePolyline(encoded);
    if (!coords.length || coords.length < 2) throw new Error('Polyline vazia.');

    desenharRotaGoogle(
      coords,
      rotaModo === 'retorno'
        ? 'Rota de saída calculada pelo Google Maps.'
        : 'Rota de entrada calculada pelo Google Maps.'
    );

  } catch (error) {
    console.error('Erro ao traçar rota pelo Google Maps:', error);

    limparRotaAtual();

    destinoMarker = L.marker([destinoLat, destinoLng])
      .addTo(map)
      .bindPopup(rotaModo === 'retorno' ? '<b>Portaria / Saída</b>' : '<b>Destino</b>');

    rotaAtualCoords = null;
    window.rotaAtualCoords = null;

    document.getElementById('status-rota').innerText =
      'Não foi possível calcular a rota pelo Google Maps. Verifique a rota na API.';

    centralizarMapaNoVisitante(origemLat, origemLng, false);
  }
}

function decodePolyline(encoded) {
  let points = [];
  let index = 0;
  let lat = 0;
  let lng = 0;

  while (index < encoded.length) {
    let b, shift = 0, result = 0;

    do {
      b = encoded.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);

    lat += (result & 1) ? ~(result >> 1) : (result >> 1);

    shift = 0;
    result = 0;

    do {
      b = encoded.charCodeAt(index++) - 63;
      result |= (b & 0x1f) << shift;
      shift += 5;
    } while (b >= 0x20);

    lng += (result & 1) ? ~(result >> 1) : (result >> 1);

    points.push([lat / 1e5, lng / 1e5]);
  }

  return points;
}

        }

       function iniciarRastreamentoVisitante(centralizar = false) {
    if (!navigator.geolocation) {

        alert('Este celular não suporta localização.');
        return;
    }

    if (geolocationWatchId) return;

    document.getElementById('status-rota').innerText =
        'Ative a localização do celular e aguarde o GPS iniciar...';

    geolocationWatchId = navigator.geolocation.watchPosition(
        async (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy || 999;
            const speedMs = position.coords.speed;

            // Bloqueia somente GPS MUITO ruim
            if (accuracy > 200) {
                console.log('GPS muito ruim ignorado:', accuracy);
                document.getElementById('status-rota').innerText =
                    `GPS muito fraco (${Math.round(accuracy)}m). Aguarde melhorar.`;
                mostrarAlerta('warning', `GPS muito fraco (${Math.round(accuracy)}m). Aguarde melhorar.`);
                return;
            }

            // Aceita GPS médio, mas avisa
            if (accuracy > 50) {
                document.getElementById('status-rota').innerText =
                    `GPS aproximado (${Math.round(accuracy)}m).`;
            }

            const novaPosicao = { lat, lng };

            if (ultimaPosicaoValida) {
                const distanciaSalto = distanciaEntrePontos(ultimaPosicaoValida, novaPosicao);

                // Só bloqueia salto absurdo quando o GPS também estiver ruim
                if (distanciaSalto > 250 && accuracy > 100) {
                    console.log('GPS ignorado por salto grande:', distanciaSalto, 'Precisão:', accuracy);
                    document.getElementById('status-rota').innerText =
                        'GPS oscilando. Aguardando posição mais estável...';
                    return;
                }
            }

            const velocidadeKmh = calcularVelocidadePorGps(lat, lng, accuracy, speedMs);

            minhaPosicaoAtual = novaPosicao;
            atualizarMarcadorVisitante(lat, lng, centralizar);

            if (modoNavegacaoAtivo || destinoAtualCoords) {
                centralizarMapaNoVisitante(lat, lng, true);
            } else if (centralizar) {
                centralizarMapaNoVisitante(lat, lng, true);
            }

            centralizar = false;

            if (accuracy <= 50) {
                document.getElementById('status-rota').innerText =
                    `GPS preciso: ${Math.round(accuracy)}m`;
            }

            await verificarVisitanteParado(lat, lng);
            await verificarVelocidade(velocidadeKmh);

            if (destinoAtualCoords) {
                verificarChegada(lat, lng);
                await verificarDesvio(lat, lng, accuracy);
            }

            ultimaPosicaoValida = novaPosicao;

            const agora = Date.now();
            if (agora - ultimoEnvioPosicao < 3000) return;
            ultimoEnvioPosicao = agora;

            await enviarPosicaoTempoReal(lat, lng, accuracy, velocidadeKmh);
        },
        (error) => {
            console.error('Erro geolocalização:', error);

            let msg = 'Não foi possível obter sua localização.';

            if (error.code === 1) {
                msg = 'Permissão de localização negada. Ative a localização do navegador.';
            } else if (error.code === 2) {
                msg = 'GPS indisponível. Ative o GPS do celular.';
            } else if (error.code === 3) {
                msg = 'GPS demorou para responder. Tente novamente.';
            }

            document.getElementById('status-rota').innerText = msg;
            alert(msg);
        },
        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 20000
        }
    );
}
async function calcularRotaGoogle(origem, destino) {
  const origemLat = Number(origem?.lat);
  const origemLng = Number(origem?.lng);
  const destinoLat = Number(destino?.lat);
  const destinoLng = Number(destino?.lng);

  console.log('ORIGEM GOOGLE:', { lat: origemLat, lng: origemLng });
  console.log('DESTINO GOOGLE:', { lat: destinoLat, lng: destinoLng });

  if (
    !Number.isFinite(origemLat) ||
    !Number.isFinite(origemLng) ||
    !Number.isFinite(destinoLat) ||
    !Number.isFinite(destinoLng)
  ) {
    throw new Error('Coordenadas inválidas para enviar ao Google Maps.');
  }

  return await apiPost('/google/rota', {
    origem: { lat: origemLat, lng: origemLng },
    destino: { lat: destinoLat, lng: destinoLng }
  });
}

function atualizarMarcadorVisitante(lat, lng, centralizar = false) {
            if (visitanteMarker) {
                visitanteMarker.setLatLng([lat, lng]);
            } else {
                visitanteMarker = L.circleMarker([lat, lng], {
                    radius: 8,
                    color: '#10b981',
                    fillColor: '#10b981',
                    fillOpacity: 0.9
                }).addTo(map).bindPopup('<b>Você está aqui</b>');
            }

            if (centralizar && map) {
                centralizarMapaNoVisitante(lat, lng, true);
            }
        }

        function distanciaMetros(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const toRad = deg => deg * Math.PI / 180;

            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);

            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function distanciaPontoSegmentoMetros(px, py, x1, y1, x2, y2) {
            function toXY(lat, lng) {
                const ky = 111320;
                const kx = 111320 * Math.cos(lat * Math.PI / 180);
                return { x: lng * kx, y: lat * ky };
            }

            const p = toXY(px, py);
            const a = toXY(x1, y1);
            const b = toXY(x2, y2);

            const abx = b.x - a.x;
            const aby = b.y - a.y;
            const apx = p.x - a.x;
            const apy = p.y - a.y;

            const ab2 = abx * abx + aby * aby;
            let t = ab2 === 0 ? 0 : (apx * abx + apy * aby) / ab2;
            t = Math.max(0, Math.min(1, t));

            const cx = a.x + abx * t;
            const cy = a.y + aby * t;

            const dx = p.x - cx;
            const dy = p.y - cy;

            return Math.sqrt(dx * dx + dy * dy);
        }

      function distanciaDaRota(lat, lng) {
  const coords = window.rotaAtualCoords || [];
  if (coords.length < 2) return 0;

  let menor = Infinity;

  for (let i = 0; i < coords.length - 1; i++) {
    const a = coords[i];
    const b = coords[i + 1];

    const dist = distanciaPontoSegmentoMetros(
      lat,
      lng,
      a[0],
      a[1],
      b[0],
      b[1]
    );

    if (dist < menor) menor = dist;
  }

  return menor;
}

   PATCH FINAL - SOMENTE MAPA DO VISITANTE
   Mantém login, telas, API, cadastro e fluxo original.
   Corrige:
   - rota por rua com fallback OSRM;

   - centralização estilo navegação;
   - sem ponto verde "jogado" fora da via quando existe rota.

let visitanteMarkerRealGpsZayron = null;
let ultimaPosicaoExibidaZayron = null;

function zayronCoordValida(lat, lng) {
    lat = Number(lat);
    lng = Number(lng);
    return Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180;
}

function zayronDistanciaMetrosPontos(a, b) {
    const R = 6371000;
    const rad = v => v * Math.PI / 180;
    const dLat = rad(b.lat - a.lat);
    const dLng = rad(b.lng - a.lng);
    const h =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) *
        Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

function zayronProjetarNaRota(p, a, b) {
    const x = p.lng, y = p.lat;
    const x1 = a.lng, y1 = a.lat;
    const x2 = b.lng, y2 = b.lat;

    const dx = x2 - x1;
    const dy = y2 - y1;

    if (dx === 0 && dy === 0) return { lat: a.lat, lng: a.lng };

    let t = ((x - x1) * dx + (y - y1) * dy) / (dx * dx + dy * dy);
    t = Math.max(0, Math.min(1, t));

    return {
        lat: y1 + t * dy,
        lng: x1 + t * dx
    };
}

function zayronNormalizarRota(coords) {
    return (coords || [])
        .map(c => {
            if (Array.isArray(c)) return { lat: Number(c[0]), lng: Number(c[1]) };
            return { lat: Number(c.lat ?? c.latitude), lng: Number(c.lng ?? c.longitude) };
        })
        .filter(p => zayronCoordValida(p.lat, p.lng));
}

function zayronSnapNaRota(lat, lng) {
    const rota = zayronNormalizarRota(window.rotaAtualCoords || []);
    const real = { lat: Number(lat), lng: Number(lng) };

    if (!zayronCoordValida(real.lat, real.lng) || rota.length < 2) {
        return { ponto: real, distancia: 0 };
    }

    let melhor = { ponto: real, distancia: Infinity };

    for (let i = 0; i < rota.length - 1; i++) {
        const projetado = zayronProjetarNaRota(real, rota[i], rota[i + 1]);
        const dist = zayronDistanciaMetrosPontos(real, projetado);

        if (dist < melhor.distancia) {
            melhor = { ponto: projetado, distancia: dist };
        }
    }

    return melhor;
}

function zayronPosicaoExibidaVisitante(lat, lng) {
    const snap = zayronSnapNaRota(lat, lng);

    // Se existe rota, mostra o visitante colado nela, como apps de navegação.
    // A distância real ainda continua sendo usada para detectar desvio.
    if ((window.rotaAtualCoords || []).length >= 2 && snap.ponto && zayronCoordValida(snap.ponto.lat, snap.ponto.lng)) {
        return snap.ponto;
    }

    return { lat: Number(lat), lng: Number(lng) };
}

function zayronAnimarMarcador(marker, destino) {
    if (!marker || !destino) return;

    const atual = marker.getLatLng();
    const inicio = { lat: atual.lat, lng: atual.lng };
    const fim = { lat: Number(destino.lat), lng: Number(destino.lng) };

    if (!zayronCoordValida(fim.lat, fim.lng)) return;

    const frames = 14;
    let frame = 0;

    if (marker._zayronAnimTimer) {
        clearInterval(marker._zayronAnimTimer);
    }

    marker._zayronAnimTimer = setInterval(() => {
        frame++;
        const t = Math.min(1, frame / frames);
        const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

        marker.setLatLng([
            inicio.lat + (fim.lat - inicio.lat) * ease,
            inicio.lng + (fim.lng - inicio.lng) * ease
        ]);

        if (frame >= frames) {
            clearInterval(marker._zayronAnimTimer);
            marker._zayronAnimTimer = null;
        }
    }, 24);
}

async function zayronCalcularRotaOSRM(origem, destino) {
    const url =
        'https://router.project-osrm.org/route/v1/driving/' +
        origem.lng + ',' + origem.lat + ';' + destino.lng + ',' + destino.lat +
        '?overview=full&geometries=geojson&steps=false';

    const res = await fetch(url);
    const data = await res.json();

    const coords = data?.routes?.[0]?.geometry?.coordinates;
    if (!Array.isArray(coords) || coords.length < 2) {
        throw new Error('OSRM não retornou rota.');
    }

    return coords.map(c => [c[1], c[0]]);
}

function zayronLimparRotaAtual() {
    if (routingControl) {
        try { map.removeControl(routingControl); } catch(e) {}
        routingControl = null;
    }

    if (window.rotaPolyline) {
        try { map.removeLayer(window.rotaPolyline); } catch(e) {}
        window.rotaPolyline = null;
    }

    if (window.rotaPolylineBorda) {
        try { map.removeLayer(window.rotaPolylineBorda); } catch(e) {}
        window.rotaPolylineBorda = null;
    }

    if (destinoMarker) {
        try { map.removeLayer(destinoMarker); } catch(e) {}
        destinoMarker = null;
    }
}

function zayronDesenharRotaCorrigida(coords, destinoLat, destinoLng, mensagem) {
    if (!map || !Array.isArray(coords) || coords.length < 2) return;

    zayronLimparRotaAtual();

    destinoMarker = L.marker([destinoLat, destinoLng])
        .addTo(map)
        .bindPopup(rotaModo === 'retorno' ? '<b>Portaria / Saída</b>' : '<b>Destino</b>');

    window.rotaPolylineBorda = L.polyline(coords, {
        color: '#ffffff',
        weight: 13,
        opacity: 0.95,
        lineJoin: 'round',
        lineCap: 'round',
        smoothFactor: 2
    }).addTo(map);

    window.rotaPolyline = L.polyline(coords, {
        color: '#2563eb',
        weight: 8,
        opacity: 1,
        lineJoin: 'round',
        lineCap: 'round',
        smoothFactor: 2
    }).addTo(map);

    rotaAtualCoords = coords;
    window.rotaAtualCoords = coords;
    ultimaAtualizacaoRotaEm = Date.now();

    const status = document.getElementById('status-rota');
    if (status) status.innerText = mensagem || 'Rota calculada.';

    try {
        map.fitBounds(coords, getPaddingMapa());
    } catch(e) {
        const origem = obterOrigemRota();
        centralizarMapaNoVisitante(origem[0], origem[1], false);
    }
}

// Sobrescreve somente o cálculo/desenho da rota.
async function tracarRotaAteDestino(destLat, destLng, forceRecreate = false) {
    if (!map) return;

    const origemArray = obterOrigemRota();
    modoNavegacaoAtivo = true;

    const origem = { lat: Number(origemArray[0]), lng: Number(origemArray[1]) };
    const destino = { lat: Number(destLat), lng: Number(destLng) };

    if (!zayronCoordValida(origem.lat, origem.lng) || !zayronCoordValida(destino.lat, destino.lng)) {
        const status = document.getElementById('status-rota');
        if (status) status.innerText = 'Coordenadas inválidas para calcular rota.';
        return;
    }

    const status = document.getElementById('status-rota');
    if (status) status.innerText = 'Calculando rota...';

    let coords = null;

    // 1) Tenta a rota do backend/Google que já existia.
    try {
        const rotaGoogle = await calcularRotaGoogle(
            { lat: origem.lat, lng: origem.lng },
            { lat: destino.lat, lng: destino.lng }
        );

        const encoded = rotaGoogle?.polyline?.encodedPolyline;
        if (encoded) {
            coords = decodePolyline(encoded);
        }
    } catch (e) {
        console.warn('Google/backend rota falhou, usando OSRM:', e);
    }

    // 2) Fallback por rua via OSRM.
    if (!coords || coords.length < 2) {
        try {
            coords = await zayronCalcularRotaOSRM(origem, destino);
        } catch (e) {
            console.warn('OSRM falhou, usando linha simples:', e);
            coords = [[origem.lat, origem.lng], [destino.lat, destino.lng]];
        }
    }

 zayronDesenharRotaCorrigida(
    coords,
    destino.lat,
    destino.lng,
    rotaModo === 'retorno'
        ? 'Rota de saída calculada.'
        : 'Rota de entrada calculada.'
);

// Atualiza imediatamente o marcador colado na rota, se já houver GPS.
if (minhaPosicaoAtual) {
    atualizarMarcadorVisitante(minhaPosicaoAtual.lat, minhaPosicaoAtual.lng, false);
}
}
// Sobrescreve somente o marcador do visitante para não ficar jogado fora da rota.
function atualizarMarcadorVisitante(lat, lng, centralizar = false) {
    if (!map || !zayronCoordValida(lat, lng)) return;

    const real = { lat: Number(lat), lng: Number(lng) };
    const exibida = zayronPosicaoExibidaVisitante(real.lat, real.lng);
    ultimaPosicaoExibidaZayron = exibida;

    // Marcador principal: sempre mostrado na rota quando houver rota.
    if (visitanteMarker) {
        zayronAnimarMarcador(visitanteMarker, exibida);
    } else {
        visitanteMarker = L.circleMarker([exibida.lat, exibida.lng], {
            radius: 10,
            color: '#ffffff',
            fillColor: '#10b981',
            fillOpacity: 1,
            weight: 4
        }).addTo(map).bindPopup('<b>Você está aqui</b>');
    }

    // Marcador real pequeno: ajuda diagnóstico, mas não polui.
    if (!visitanteMarkerRealGpsZayron) {
        visitanteMarkerRealGpsZayron = L.circleMarker([real.lat, real.lng], {
            radius: 4,
            color: '#fbbf24',
            fillColor: '#fbbf24',
            fillOpacity: 0.55,
            weight: 1,
            opacity: 0.65
        }).addTo(map);
    } else {
        visitanteMarkerRealGpsZayron.setLatLng([real.lat, real.lng]);
    }

    if (centralizar && map) {
        centralizarMapaNoVisitante(real.lat, real.lng, true);
    }
}

// Centralização usa a posição exibida, não o GPS bruto.
function centralizarMapaNoVisitante(lat, lng, animate = true) {
    if (!map || lat == null || lng == null) return;

    const exibida = zayronPosicaoExibidaVisitante(Number(lat), Number(lng));
    const zoom = isMobile() ? ZOOM_NAVEGACAO_MOBILE : ZOOM_NAVEGACAO;

    map.setView([exibida.lat, exibida.lng], zoom, { animate });

    setTimeout(() => {
        if (!map) return;

        if (isMobile()) {
            map.panBy([0, MAPA_PAINEL_OFFSET_VERTICAL], { animate: false });
        } else {
            map.panBy([-MAPA_PAINEL_OFFSET_DESKTOP, MAPA_PAINEL_OFFSET_VERTICAL], { animate: false });
        }
    }, 80);
}

(function(){

  function status(msg){

  function ok(lat,lng){

  }

  function pnt(p){
    if(Array.isArray(p)) return { lat:Number(p[0]), lng:Number(p[1]) };
    return { lat:Number(p?.lat ?? p?.latitude), lng:Number(p?.lng ?? p?.longitude) };
  }

  function dist(a,b){
    const R = 6371000;
    const rad = x => x * Math.PI / 180;
    const dLat = rad(b.lat-a.lat);
    const dLng = rad(b.lng-a.lng);
    const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
    return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
  }

  function project(p,a,b){
    const x=p.lng,y=p.lat,x1=a.lng,y1=a.lat,x2=b.lng,y2=b.lat;
    const dx=x2-x1,dy=y2-y1;
    if(dx===0 && dy===0) return {lat:a.lat,lng:a.lng};
    let t=((x-x1)*dx+(y-y1)*dy)/(dx*dx+dy*dy);
    t=Math.max(0,Math.min(1,t));
    return {lat:y1+t*dy,lng:x1+t*dx};
  }

  function distanciaDaRota(p, rota){
    if(!rota || rota.length < 2) return Infinity;
    let best = Infinity;
    for(let i=0;i<rota.length-1;i++){
      const q = project(p, rota[i], rota[i+1]);
      best = Math.min(best, dist(p,q));
    }
    return best;
  }

  function salvarGps(lat,lng,speed,accuracy){
    if(!ok(lat,lng)) return null;
    const p = {
      lat:Number(lat),
      lng:Number(lng),
      speed:Number(speed || 0),
      accuracy:Number(accuracy || 0),
      created_at:new Date().toISOString()
    };
    window.minhaPosicaoAtual = { ...(window.minhaPosicaoAtual || {}), lat:p.lat, lng:p.lng, latitude:p.lat, longitude:p.lng };
    window.__zayronUltimaPosicaoReal = p;

  function pegarGps(){

      created_at:new Date().toISOString()
    };

    if(typeof window.apiRequest === "function"){
      try{ window.apiRequest("/posicoes-tempo-real",{method:"POST",body:JSON.stringify(payload)}); return; }catch(e){}
    }

    fetch("/posicoes-tempo-real",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).catch(()=>{});
  }

  function mostrarRetorno(){
    if(document.getElementById("zayron-retorno-portaria")) return;

    const btn = document.createElement("button");
    btn.id = "zayron-retorno-portaria";
    btn.type = "button";
    btn.innerText = "Retornar à Portaria";
    btn.style.cssText = "position:fixed;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:99999;height:56px;border:0;border-radius:16px;background:#f59e0b;color:#111827;font-weight:900;font-size:18px;box-shadow:0 10px 28px rgba(0,0,0,.32);";
    btn.onclick = () => window.tracarRotaRetornoPortaria();
    document.body.appendChild(btn);
  }

  async function iniciarFluxo(destino,modo){
    const origem = await pegarGps();
    if(!origem){
      alert("Permita a localização do celular para iniciar a rota.");
      return;
    }

    monitor.modo = modo || "entrada";
    monitor.destino = destino;
    monitor.ativo = true;
    monitor.ultimaMovimentacao = Date.now();

    status("Calculando rota de monitoramento...");

    try{
      const rota = await calcularRota(origem,destino);
      monitor.rota = rota.coords;
      window.rotaAtualCoords = monitor.rota.map(p => [p.lat,p.lng]);
      try{ rotaAtualCoords = window.rotaAtualCoords; }catch(e){}

      desenharRotaInterna();
      iniciarWatch();

      status(modo === "retorno" ? "Retorno monitorado pelo Zayron." : "Ida monitorada pelo Zayron.");
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
  abrirBotaoIOS(
    `comgooglemaps://?saddr=${origem.lat},${origem.lng}&daddr=${destino.lat},${destino.lng}&directionsmode=driving`,
    `maps://?saddr=${origem.lat},${origem.lng}&daddr=${destino.lat},${destino.lng}`,
    `https://www.google.com/maps/dir/?api=1&origin=${origem.lat},${origem.lng}&destination=${destino.lat},${destino.lng}&travelmode=driving`
  );
} else {
  abrirGoogleMaps(origem,destino);
}
    }catch(e){
      alert("Não consegui calcular a rota de monitoramento. Verifique internet e destino.");
      status("Erro ao calcular rota.");
    }
  }

  // Tela de acesso facilitada: se API falhar, continua com o nome digitado.
  function instalarAcessoFacilitado(){
    const input = document.querySelector("input");
    const botoes = Array.from(document.querySelectorAll("button"));
    const btn = botoes.find(b => String(b.innerText || "").toLowerCase().includes("continuar"));

    if(!btn || btn.__zayronFacil) return;
    btn.__zayronFacil = true;

    btn.addEventListener("click", function(){
      monitor.condominioNome = input?.value?.trim() || "Terras da Alvorada";
      localStorage.setItem("zayron_condominio_nome", monitor.condominioNome);

      setTimeout(() => {
        const msg = Array.from(document.querySelectorAll("*")).find(el => String(el.innerText || "").includes("Failed to fetch"));
        if(msg){
          msg.innerText = "Modo local ativo. Continue escolhendo o destino.";
          msg.textContent = "Modo local ativo. Continue escolhendo o destino.";
        }
      }, 1200);
    }, true);
  }

  // Funções originais preservadas por nome.
  window.tracarRotaAteDestino = function(destLat,destLng){
    const d = destinoAtual(destLat,destLng);
    if(!d){
      alert("Destino sem coordenada. Verifique rua/número ou lote.");
      return;
    }
    iniciarFluxo(d,"entrada");
  };

  window.tracarRotaRetornoPortaria = function(){
    iniciarFluxo(PORTARIA_REAL,"retorno");
  };

  window.getPortariaCoords = function(){
    return [PORTARIA_REAL.lat,PORTARIA_REAL.lng];
  };

  setInterval(instalarAcessoFacilitado,1000);
  instalarAcessoFacilitado();

  console.log("✅ ZAYRON: tela original + acesso facilitado + Google Maps + monitoramento.");
})();


/* ============================================================
   ZAYRON - CORREÇÃO iPHONE ABRIR GOOGLE MAPS
   Android: abre Google Maps normal.
   iPhone: tenta app Google Maps com comgooglemaps://
           se não abrir, mostra botão Apple Maps.
============================================================ */
(function(){
  if(window.__ZAYRON_IOS_GOOGLE_MAPS_FIX__) return;
  window.__ZAYRON_IOS_GOOGLE_MAPS_FIX__ = true;

  function isIOS(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function abrirBotaoIOS(googleAppUrl, appleUrl, googleWebUrl){
    let old = document.getElementById("zayron-ios-maps-panel");
    if(old) old.remove();

    const panel = document.createElement("div");
    panel.id = "zayron-ios-maps-panel";
    panel.style.cssText = `
      position:fixed;
      left:14px;
      right:14px;
      bottom:calc(18px + env(safe-area-inset-bottom));
      z-index:999999;
      background:#020617;
      border:1px solid rgba(148,163,184,.35);
      border-radius:20px;
      padding:14px;
      box-shadow:0 10px 30px rgba(0,0,0,.38);
      font-family:Arial,sans-serif;
    `;

    panel.innerHTML = `
      <div style="color:#fff;font-weight:900;font-size:17px;margin-bottom:10px;text-align:center">
        Abrir navegação
      </div>
      <button id="zayron-open-google-ios" style="width:100%;height:54px;border:0;border-radius:14px;background:#2563eb;color:white;font-weight:900;font-size:17px;margin-bottom:10px">
        Abrir no Google Maps
      </button>
      <button id="zayron-open-apple-ios" style="width:100%;height:54px;border:0;border-radius:14px;background:#f59e0b;color:#111827;font-weight:900;font-size:17px;margin-bottom:10px">
        Abrir no Apple Maps
      </button>
      <button id="zayron-open-web-ios" style="width:100%;height:48px;border:0;border-radius:14px;background:#334155;color:white;font-weight:900;font-size:15px">
        Abrir Google Maps no navegador
      </button>
    `;

    document.body.appendChild(panel);

    document.getElementById("zayron-open-google-ios").onclick = function(){
      window.location.href = googleAppUrl;
    };

    document.getElementById("zayron-open-apple-ios").onclick = function(){
      window.location.href = appleUrl;
    };

    document.getElementById("zayron-open-web-ios").onclick = function(){
      window.location.href = googleWebUrl;
    };
  }

  window.abrirGoogleMaps = function(origem, destino){
    if(!origem || !destino) return;

    const o = origem.lat + "," + origem.lng;
    const d = destino.lat + "," + destino.lng;

    const googleWebUrl =
      "https://www.google.com/maps/dir/?api=1" +
      "&origin=" + encodeURIComponent(o) +
      "&destination=" + encodeURIComponent(d) +
      "&travelmode=driving";

    const googleAppUrl =
      "comgooglemaps://?saddr=" + encodeURIComponent(o) +
      "&daddr=" + encodeURIComponent(d) +
      "&directionsmode=driving";

    const appleUrl =
      "http://maps.apple.com/?saddr=" + encodeURIComponent(o) +
      "&daddr=" + encodeURIComponent(d) +
      "&dirflg=d";

    if(isIOS()){
      // No iPhone, abertura automática costuma ser bloqueada.
      // Mostra painel para o clique do usuário abrir o app correto.
      abrirBotaoIOS(googleAppUrl, appleUrl, googleWebUrl);
      return;
    }

    window.location.href = googleWebUrl;
  };

  // Também cria função alternativa para patches que chamam outro nome.
  window.abrirMaps = window.abrirGoogleMaps;

  console.log("✅ Correção iOS Google Maps aplicada.");
})();

</script>
