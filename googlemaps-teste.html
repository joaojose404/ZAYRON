<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste Google Maps</title>

<style>
html, body, #map {
    width: 100%;
    height: 100%;
    margin: 0;
}
</style>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBgk1MsbiRFMwPZFvZusOrE28-JHKW8iN4"></script>

</head>
<body>

<div id="map"></div>

<script>

const map = new google.maps.Map(
  document.getElementById("map"),
  {
    zoom: 19,
    center: {
      lat: -23.578216,
      lng: -46.439685
    },
    mapTypeId: "satellite"
  }
);

const marker = new google.maps.Marker({
  position: {
    lat:-23.578216,
    lng:-46.439685
  },
  map
});

navigator.geolocation.watchPosition(
  function(pos){

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    console.log(
      'LAT:',
      lat,
      'LNG:',
      lng,
      'SPEED:',
      pos.coords.speed
    );

    marker.setPosition({
      lat,
      lng
    });

    map.panTo({
      lat,
      lng
    });

  },
  function(err){
    console.error(err);
  },
  {
    enableHighAccuracy:true,
    maximumAge:0,
    timeout:10000
  }
);

navigator.geolocation.watchPosition(
  function(pos){

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    marker.setPosition({
      lat,
      lng
    });

    map.panTo({
      lat,
      lng
    });

  },
  function(err){
    console.error(err);
  },
  {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 10000
  }
);

</script>

</body>
</html>
