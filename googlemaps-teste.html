<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teste Mapbox</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link href="https://api.mapbox.com/mapbox-gl-js/v3.5.0/mapbox-gl.css"
rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.5.0/mapbox-gl.js"></script>

<script>

mapboxgl.accessToken =
'pk.eyJ1Ijoiam9hb2pvc2UzMjciLCJhIjoiY21saDIxbXp5MDRmZzNjb212bmh3cHBnYSJ9.ECEzBuvW7wicahEyvcyQCQ';

const map =
new mapboxgl.Map({
    container: 'map',

    style:
    'mapbox://styles/mapbox/satellite-streets-v12',

    center: [-46.439, -23.578],

    zoom: 18,

    pitch: 60,

    bearing: 0
});

let marker = null;

navigator.geolocation.watchPosition(

(position) => {

    const lat =
        position.coords.latitude;

    const lng =
        position.coords.longitude;

    const heading =
        position.coords.heading || 0;

    if (!marker) {

        marker =
            new mapboxgl.Marker()
            .setLngLat([lng, lat])
            .addTo(map);

    } else {

        marker.setLngLat([
            lng,
            lat
        ]);
    }

    map.easeTo({

        center: [lng, lat],

        bearing: heading,

        pitch: 60,

        zoom: 19,

        duration: 1000
    });

    console.log(
        'GPS',
        lat,
        lng,
        heading
    );

},

(err) => {

    console.error(err);

},

{
    enableHighAccuracy: true
});

</script>

</body>
</html>
